    metrics collection...\"\n  /usr/local/bin/collect_metrics.sh stop >> $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log
    2>&1\n  wait $METRICS_COLLECTOR_PID 2>/dev/null || true\n  \n  # Process collected
    metrics\n  echo \"Processing collected metrics...\"\n  /usr/local/bin/collect_metrics.sh
    process >> $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log 2>&1\n
    \ \n  echo \"Metrics collection complete. Check metrics_collection.log for details.\"\nfi\n\nexport
    LLMDBENCH_HARNESS_START=$(date -d \"@${start}\" --iso-8601=seconds)\nexport LLMDBENCH_HARNESS_STOP=$(date
    -d \"@${stop}\" --iso-8601=seconds)\nexport LLMDBENCH_HARNESS_DELTA=PT$(echo \"$stop
    - $start\" | bc)S\nexport LLMDBENCH_HARNESS_VERSION=$(cd /workspace/inference-perf
    2>/dev/null && git rev-parse HEAD 2>/dev/null || grep '^inference-perf:' /workspace/repos.txt
    2>/dev/null | cut -d' ' -f3 || echo 'unknown')\n\n# Write run metadata to a file
    so the analyzer can read it.\n# Environment variables exported here are lost when
    this subshell exits,\n# so the file serves as the handoff mechanism to the analysis
    phase.\n# Escape free text for the double-quoted YAML scalars below. Backslash
    first, or\n# the quote escapes get double-escaped. Control characters are illegal
    in a\n# double-quoted scalar at all, and an unparseable file loses every key in
    it, not\n# just this one.\n_yaml_escape() {\n  local text=\"${1:-}\" out=\"\"
    index character\n  text=\"${text//\\\\/\\\\\\\\}\"\n  text=\"${text//\\\"/\\\\\\\"}\"\n
    \ text=\"${text//$'\\t'/\\\\t}\"\n  text=\"${text//$'\\n'/\\\\n}\"\n  for (( index=0;
    index<${#text}; index++ )); do\n    character=\"${text:index:1}\"\n    if [[ \"$character\"
    == [[:cntrl:]] ]]; then\n      printf -v character '\\\\x%02x' \"'$character\"\n
    \   fi\n    out+=\"$character\"\n  done\n  printf '%s' \"$out\"\n}\n_description_text=\"$(_yaml_escape
    \"${LLMDBENCH_DESCRIPTION_TEXT:-}\")\"\n_description_keywords=\"$(_yaml_escape
    \"${LLMDBENCH_DESCRIPTION_KEYWORDS:-}\")\"\ncat > \"$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/run_metadata.yaml\"
    <<METADATA\nharness_start: \"${LLMDBENCH_HARNESS_START}\"\nharness_stop: \"${LLMDBENCH_HARNESS_STOP}\"\nharness_delta:
    \"${LLMDBENCH_HARNESS_DELTA}\"\nharness_args: \"${LLMDBENCH_HARNESS_ARGS}\"\nharness_version:
    \"${LLMDBENCH_HARNESS_VERSION}\"\nharness_name: \"${LLMDBENCH_HARNESS_NAME:-inference-perf}\"\nharness_workload:
    \"${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME:-}\"\nharness_rc: \"${LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC}\"\nexperiment_id:
    \"${LLMDBENCH_RUN_EXPERIMENT_ID:-}\"\nmodel: \"${LLMDBENCH_DEPLOY_CURRENT_MODEL:-}\"\nendpoint_url:
    \"${LLMDBENCH_HARNESS_STACK_ENDPOINT_URL:-}\"\nnamespace: \"${LLMDBENCH_VLLM_COMMON_NAMESPACE:-}\"\ndescription_text:
    \"${_description_text}\"\ndescription_keywords: \"${_description_keywords}\"\nMETADATA\necho
    \"Run metadata written to $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/run_metadata.yaml\"\n\n#
    If benchmark harness returned with an error, exit here\nif [[ $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC
    -ne 0 ]]; then\n  echo \"Harness returned with error $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC\"\n
    \ exit $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC\nfi\necho \"Harness completed successfully.\"\n\nexit
    $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC\n"
  inferencemax-analyze_results.sh: |
    #!/usr/bin/env bash

    # Convert results into universal format
    export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=0
    for result in $(find $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR -maxdepth 1 -name '*.json'); do
      result_fname=$(echo $result | rev | cut -d '/' -f 1 | rev)

      echo "Converting $result_fname to Benchmark Report v0.1"
      benchmark-report $result -b 0.1 -w inferencemax $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/benchmark_report,_$result_fname.yaml 2> >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log >&2)
      rc=$?
      # Report errors but don't quit
      if [[ $rc -ne 0 ]]; then
        echo "benchmark-report returned with error $rc converting: $result"
        export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=$rc
      fi
      echo
      echo "Converting $result_fname to Benchmark Report v0.2"
      benchmark-report $result -b 0.2 -w inferencemax $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/benchmark_report_v0.2,_$result_fname.yaml 2> >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log >&2)
      rc=$?
      # Report errors but don't quit
      if [[ $rc -ne 0 ]]; then
        echo "benchmark-report returned with error $rc converting: $result"
        export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=$rc
      fi
    done

    if [[ $LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC -ne 0 ]]; then
      echo "Results data conversion completed with errors."
      exit $LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC
    fi
    echo "Results data conversion completed successfully."

    mkdir -p "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/analysis"
    result_start=$(grep -nr "Result ==" $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log | tail -1 | cut -d ':' -f 1)
    total_file_lenght=$(cat $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log | wc -l)
    cat $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log | sed "$result_start,$total_file_lenght!d" > $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/analysis/summary.txt
    _summary_rc=$?

    # Integrate vLLM metrics into benchmark report(s) v0.2 and generate plots
    _metrics_dir="$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics"
    if [[ -f "$_metrics_dir/processed/metrics_summary.json" ]]; then
      echo "Integrating metrics summary into benchmark report(s) v0.2..."
      for _report in $(find "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR" -maxdepth 1 -name 'benchmark_report_v0.2,_*.yaml'); do
        python3 -c "
    import yaml, sys
    from benchmark_report.metrics_processor import add_metrics_to_benchmark_report
    report_file, metrics_dir = sys.argv[1], sys.argv[2]
    with open(report_file) as f:
        br_dict = yaml.safe_load(f)
    br_dict = add_metrics_to_benchmark_report(br_dict, metrics_dir)
    with open(report_file, 'w') as f:
        yaml.dump(br_dict, f, default_flow_style=False, allow_unicode=True)
    print('Metrics integrated into: ' + report_file)
    " "$_report" "$_metrics_dir" 2>&1 | tee -a "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log" || true
      done
      echo "Generating metric plots..."
      python3 /usr/local/bin/visualize_metrics.py "$_metrics_dir" 2>&1 | tee -a "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log" || true
    fi

    exit $_summary_rc
