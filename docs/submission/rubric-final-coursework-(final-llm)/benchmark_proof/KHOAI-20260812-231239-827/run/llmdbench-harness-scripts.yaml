            """
            dump_dict = {}
            for f in fields(self):
                value = getattr(self, f.name)
                if f.name == "launcher_infos":
                    dump_list = []
                    for v in value:
                        dump_list.append(
                            v.dump() if hasattr(v, "dump") and callable(v.dump) else v
                        )
                    dump_dict[f.name] = dump_list
                    continue

                dump_dict[f.name] = (
                    value.dump()
                    if hasattr(value, "dump") and callable(value.dump)
                    else value
                )

            return dump_dict


