apiVersion: v1
data:
  __init__.py: ""
  aiperf-analyze_results.sh: |
    #!/usr/bin/env bash

    # Convert results into universal format
    export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=0
    for result in $(find $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR -maxdepth 1 -name 'profile_export_aiperf.json'); do
      result_fname=$(echo $result | rev | cut -d '/' -f 1 | rev)

      echo "Converting $result_fname to Benchmark Report v0.1"
      benchmark-report $result -b 0.1 -w aiperf $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/benchmark_report,_$result_fname.yaml 2> >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log >&2)
      rc=$?

      # Report errors but don't quit
      if [[ $rc -ne 0 ]]; then
        echo "benchmark-report returned with error $rc converting: $result"
        export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=$rc
      fi
      echo
      echo "Converting $result_fname to Benchmark Report v0.2"
      benchmark-report $result -b 0.2 -w aiperf $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/benchmark_report_v0.2,_$result_fname.yaml 2> >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log >&2)
      rc=$?
      # Report errors but don't quit
      if [[ $rc -ne 0 ]]; then
        echo "benchmark-report returned with error $rc converting: $result"
        export LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC=$rc
      fi
    done

    if [[ $LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC -ne 0 ]]; then
      echo "Results data conversion completed with errors."
      exit $LLMDBENCH_RUN_EXPERIMENT_CONVERT_RC
    fi
    echo "Results data conversion completed successfully."

    mkdir -p "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/analysis"
    if [[ -f "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log" ]]; then
      cp "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log" \
         "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/analysis/summary.txt"
    fi
    exit $?
  aiperf-llm-d-benchmark.sh: |
    #!/usr/bin/env bash

    mkdir -p "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR"

    # Download dataset from S3 if configured
    if [[ -n "${LLMDBENCH_RUN_DATASET_URL:-}" && "${LLMDBENCH_RUN_DATASET_URL}" == s3://* ]]; then
      DATASET_DIR="${LLMDBENCH_RUN_DATASET_DIR:-/requests/datasets}"
      DATASET_FILE=$(basename "$LLMDBENCH_RUN_DATASET_URL")
      DATASET_PATH="$DATASET_DIR/$DATASET_FILE"
      if [[ ! -f "$DATASET_PATH" ]]; then
        echo "Downloading dataset from $LLMDBENCH_RUN_DATASET_URL ..."
        mkdir -p "$DATASET_DIR"
        python3 -c "
    import boto3, os
    url = os.environ['LLMDBENCH_RUN_DATASET_URL']
    parts = url.replace('s3://', '').split('/', 1)
    bucket, key = parts[0], parts[1]
    dest = '$DATASET_PATH'
    print(f'Downloading s3://{bucket}/{key} -> {dest}')
    boto3.client('s3').download_file(bucket, key, dest)
    print(f'Download complete ({os.path.getsize(dest)} bytes)')
    "
        if [[ $? -ne 0 ]]; then
          echo "ERROR: Failed to download dataset from S3"
          exit 1
        fi
      else
        echo "Dataset already exists at $DATASET_PATH, skipping download"
      fi
    fi
    cp -f ${LLMDBENCH_RUN_WORKSPACE_DIR}/profiles/aiperf/${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME} $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME}

    # Start metrics collection in background if enabled
    if [[ "${LLMDBENCH_VLLM_COMMON_METRICS_SCRAPE_ENABLED:-false}" == "true" ]]; then
      echo "Starting metrics collection..."
      /usr/local/bin/collect_metrics.sh start >> $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log 2>&1 &
      METRICS_COLLECTOR_PID=$!
      echo "Metrics collector started with PID: $METRICS_COLLECTOR_PID"
      echo "Metrics collection logs: $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log"
    fi

    # Wait for endpoint to be ready before running benchmark
    ENDPOINT_URL=$(cat ${LLMDBENCH_RUN_WORKSPACE_DIR}/profiles/aiperf/${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME} | yq -r '.url')
    if [[ -n "$ENDPOINT_URL" && "$ENDPOINT_URL" != "null" ]]; then
      MAX_WAIT=60
      INTERVAL=10
      echo "Waiting for endpoint at ${ENDPOINT_URL}/v1/models ..."
      for i in $(seq 1 $MAX_WAIT); do
        if curl -sf -o /dev/null --max-time 5 "${ENDPOINT_URL}/v1/models" 2>/dev/null; then
          echo "Endpoint is ready (attempt $i/${MAX_WAIT})"
          break
        fi
        if [[ $i -eq $MAX_WAIT ]]; then
          echo "ERROR: Endpoint not ready after ${MAX_WAIT} attempts ($((MAX_WAIT * INTERVAL))s)"
          exit 1
        fi
        echo "Attempt $i/${MAX_WAIT}: endpoint not ready, retrying in ${INTERVAL}s..."
        sleep $INTERVAL
      done
    fi

    # Build CLI args from YAML profile, skipping empty values
    export LLMDBENCH_HARNESS_ARGS="--$(cat ${LLMDBENCH_RUN_WORKSPACE_DIR}/profiles/aiperf/${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME} \
      | yq -r 'to_entries | map(select(.value != null and .value != "")) | map("\(.key)=\(.value)") | join(" --")' \
      | sed -e 's^=none ^ ^g' -e 's^=none$^^g')"

    # Inject output-artifact-dir (framework-managed, not in profile)
    LLMDBENCH_HARNESS_ARGS="$LLMDBENCH_HARNESS_ARGS --output-artifact-dir=${LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR}"

    # Append extra pass-through args if provided
    if [[ -n "${LLMDBENCH_AIPERF_EXTRA_ARGS:-}" ]]; then
      LLMDBENCH_HARNESS_ARGS="$LLMDBENCH_HARNESS_ARGS $LLMDBENCH_AIPERF_EXTRA_ARGS"
    fi

    echo "Running aiperf benchmark"
    echo "Args: $LLMDBENCH_HARNESS_ARGS"
    AIPERF_BIN=$(command -v aiperf 2>/dev/null)
    if [[ -z "$AIPERF_BIN" ]]; then
      echo "ERROR: aiperf not found in PATH. Ensure the container image includes aiperf."
      exit 1
    fi
    start=$(date +%s.%N)
    $AIPERF_BIN profile $LLMDBENCH_HARNESS_ARGS > >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stdout.log) 2> >(tee -a $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/stderr.log >&2)
    export LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC=$?
    stop=$(date +%s.%N)

    # Stop metrics collection
    if [[ "${LLMDBENCH_VLLM_COMMON_METRICS_SCRAPE_ENABLED:-false}" == "true" ]] && [[ -n "${METRICS_COLLECTOR_PID:-}" ]]; then
      echo "Stopping metrics collection..."
      /usr/local/bin/collect_metrics.sh stop >> $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log 2>&1
      wait $METRICS_COLLECTOR_PID 2>/dev/null || true

      # Process collected metrics
      echo "Processing collected metrics..."
      /usr/local/bin/collect_metrics.sh process >> $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/metrics_collection.log 2>&1

      echo "Metrics collection complete. Check metrics_collection.log for details."
    fi

    export LLMDBENCH_HARNESS_START=$(date -d "@${start}" --iso-8601=seconds)
    export LLMDBENCH_HARNESS_STOP=$(date -d "@${stop}" --iso-8601=seconds)
    export LLMDBENCH_HARNESS_DELTA=PT$(echo "$stop - $start" | bc)S
    export LLMDBENCH_HARNESS_VERSION=$(${AIPERF_BIN:-aiperf} --version 2>/dev/null || echo "unknown")

    # Write run metadata to a file so the analyzer can read it.
    # Environment variables exported here are lost when this subshell exits,
    # so the file serves as the handoff mechanism to the analysis phase.
    # Escape free text for the double-quoted YAML scalars below. Backslash first, or
    # the quote escapes get double-escaped. Control characters are illegal in a
    # double-quoted scalar at all, and an unparseable file loses every key in it, not
    # just this one.
    _yaml_escape() {
      local text="${1:-}" out="" index character
      text="${text//\\/\\\\}"
      text="${text//\"/\\\"}"
      text="${text//$'\t'/\\t}"
      text="${text//$'\n'/\\n}"
      for (( index=0; index<${#text}; index++ )); do
        character="${text:index:1}"
        if [[ "$character" == [[:cntrl:]] ]]; then
          printf -v character '\\x%02x' "'$character"
        fi
        out+="$character"
      done
      printf '%s' "$out"
    }
    _description_text="$(_yaml_escape "${LLMDBENCH_DESCRIPTION_TEXT:-}")"
    _description_keywords="$(_yaml_escape "${LLMDBENCH_DESCRIPTION_KEYWORDS:-}")"
    cat > "$LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/run_metadata.yaml" <<METADATA
    harness_start: "${LLMDBENCH_HARNESS_START}"
    harness_stop: "${LLMDBENCH_HARNESS_STOP}"
    harness_delta: "${LLMDBENCH_HARNESS_DELTA}"
    harness_args: "${LLMDBENCH_HARNESS_ARGS}"
    harness_version: "${LLMDBENCH_HARNESS_VERSION}"
    harness_name: "${LLMDBENCH_HARNESS_NAME:-aiperf}"
    harness_workload: "${LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME:-}"
    harness_rc: "${LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC}"
    experiment_id: "${LLMDBENCH_RUN_EXPERIMENT_ID:-}"
    model: "${LLMDBENCH_DEPLOY_CURRENT_MODEL:-}"
    endpoint_url: "${LLMDBENCH_HARNESS_STACK_ENDPOINT_URL:-}"
    namespace: "${LLMDBENCH_VLLM_COMMON_NAMESPACE:-}"
    description_text: "${_description_text}"
    description_keywords: "${_description_keywords}"
    METADATA
    echo "Run metadata written to $LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR/run_metadata.yaml"

    # If benchmark harness returned with an error, exit here
    if [[ $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC -ne 0 ]]; then
      echo "Harness returned with error $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC"
      exit $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC
    fi
    echo "Harness completed successfully."

    exit $LLMDBENCH_RUN_EXPERIMENT_HARNESS_RC
  collect_metrics.sh: |
    #!/usr/bin/env bash

    # Copyright 2025 The llm-d Authors.
    # Licensed under the Apache License, Version 2.0 (the "License");

    # Metrics collection script for llm-d-benchmark
    # Collects Prometheus metrics and vLLM logs during benchmark execution

    set -euo pipefail

    # Configuration
    METRICS_DIR="${LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR}/metrics"
    COLLECTION_INTERVAL="${METRICS_COLLECTION_INTERVAL:-15}"  # seconds between collections
    # Use LLMDBENCH_VLLM_COMMON_METRICS_PORT (8200) for model services, LLMDBENCH_VLLM_COMMON_INFERENCE_PORT (8000) for standalone
    METRICS_PORT="${LLMDBENCH_VLLM_COMMON_METRICS_PORT:-${LLMDBENCH_VLLM_COMMON_INFERENCE_PORT:-8000}}"
    INFERENCE_PORT="${LLMDBENCH_VLLM_COMMON_INFERENCE_PORT:-8000}"
    METRICS_PATH="${LLMDBENCH_VLLM_MONITORING_METRICS_PATH:-/metrics}"
    METRICS_CURL_TIMEOUT="${METRICS_CURL_TIMEOUT:-30}"  # max-time for curl in seconds
    EPP_METRICS_PORT="${LLMDBENCH_EPP_METRICS_PORT:-9090}"  # EPP Prometheus metrics port
    EPP_METRICS_SECRET="${LLMDBENCH_EPP_METRICS_SECRET:-inference-gateway-sa-metrics-reader-secret}"  # pragma: allowlist secret
    _EPP_AUTH_HEADER=""  # cached bearer token header for EPP scrapes

    # Function to initialize metrics directory
    init_metrics_dir() {
        mkdir -p "$METRICS_DIR/raw" "$METRICS_DIR/processed"
        echo "Metrics directory initialized: $METRICS_DIR"
    }

    # ---------------------------------------------------------------------------
    # Pod discovery
    # ---------------------------------------------------------------------------

    # Get vLLM pod names and IPs.
    # Output: lines of "pod_name pod_ip" pairs.
    get_pod_info() {
        local namespace="$1"
        local kubectl_cmd="${KUBECTL_CMD:-kubectl}"

        # Try modelservice labels first
        local pod_info
        pod_info=$($kubectl_cmd --namespace "$namespace" get pods \
            -l llm-d.ai/inferenceServing=true \
            --field-selector=status.phase=Running \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.podIP}{"\n"}{end}' 2>/dev/null || true)

        # Fall back to standalone label
        if [[ -z "$pod_info" ]]; then
            pod_info=$($kubectl_cmd --namespace "$namespace" get pods \
                -l stood-up-via=standalone \
                --field-selector=status.phase=Running \
                -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.podIP}{"\n"}{end}' 2>/dev/null || true)
        fi

        # Final fallback: grep-based discovery using pod pattern
        if [[ -z "$pod_info" ]]; then
            local pod_pattern="${LLMDBENCH_METRICS_POD_PATTERN:-decode}"
            local pod_names
            pod_names=$($kubectl_cmd get pods -n "$namespace" 2>/dev/null | grep "$pod_pattern" | grep "Running" | awk '{print $1}')
            if [[ -n "$pod_names" ]]; then
                for pod in $pod_names; do
                    local ip
                    ip=$($kubectl_cmd get pod -n "$namespace" "$pod" -o jsonpath='{.status.podIP}' 2>/dev/null || true)
                    if [[ -n "$ip" ]]; then
                        pod_info="${pod_info:+${pod_info}$'\n'}${pod} ${ip}"
                    fi
                done
            fi
        fi

        echo "$pod_info"
    }

    # Get EPP (inference scheduler) pod names and IPs.
    # Output: lines of "pod_name pod_ip" pairs.
    get_epp_pod_info() {
        local namespace="$1"
        local kubectl_cmd="${KUBECTL_CMD:-kubectl}"

        # EPP pods are labeled with inferencepool=<name>
        local pod_info
        pod_info=$($kubectl_cmd --namespace "$namespace" get pods \
            -l inferencepool \
            --field-selector=status.phase=Running \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.podIP}{"\n"}{end}' 2>/dev/null || true)

        # Fallback: match pods with "epp" in the name
        if [[ -z "$pod_info" ]]; then
            local pod_names
            pod_names=$($kubectl_cmd get pods -n "$namespace" 2>/dev/null | grep -i "epp" | grep "Running" | awk '{print $1}')
            if [[ -n "$pod_names" ]]; then
                for pod in $pod_names; do
                    local ip
                    ip=$($kubectl_cmd get pod -n "$namespace" "$pod" -o jsonpath='{.status.podIP}' 2>/dev/null || true)
                    if [[ -n "$ip" ]]; then
                        pod_info="${pod_info:+${pod_info}$'\n'}${pod} ${ip}"
                    fi
                done
            fi
        fi

        echo "$pod_info"
    }

    # ---------------------------------------------------------------------------
    # Replica status & pod startup times
    # ---------------------------------------------------------------------------

    # Collect replica status snapshot and append to time series.
    # Filters controllers to only include those matching the current benchmark's
    # model (via LLMDBENCH_HARNESS_STACK_NAME), so stale controllers from
    # previous runs in the same namespace are excluded.
    collect_replica_status() {
        local namespace="${LLMDBENCH_VLLM_COMMON_NAMESPACE:-default}"
        local kubectl_cmd="${KUBECTL_CMD:-kubectl}"
        local model_filter="${LLMDBENCH_HARNESS_STACK_NAME:-}"
        local output_file="$METRICS_DIR/processed/replica_status.json"
        local timeseries_file="$METRICS_DIR/processed/replica_status_timeseries.json"
        local debug_log="$METRICS_DIR/raw/collection_debug.log"

        mkdir -p "$METRICS_DIR/processed" "$METRICS_DIR/raw"

        local all_json
        all_json=$($kubectl_cmd --namespace "$namespace" get deployments,statefulsets -o json 2>>"$debug_log") || all_json='{"items":[]}'

        echo "$all_json" | _RS_NAMESPACE="$namespace" _RS_OUTPUT="$output_file" _RS_TS_OUTPUT="$timeseries_file" _RS_MODEL_FILTER="$model_filter" python3 -c '
    import json, sys, os
    from datetime import datetime, timezone

    namespace = os.environ["_RS_NAMESPACE"]
    output_file = os.environ["_RS_OUTPUT"]
    ts_file = os.environ["_RS_TS_OUTPUT"]
    model_filter = os.environ.get("_RS_MODEL_FILTER", "")

    data = json.load(sys.stdin)
    snapshot = {
        "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
        "namespace": namespace,
        "controllers": [],
    }

    for item in data.get("items", []):
        kind = item.get("kind", "Deployment")
        metadata = item.get("metadata", {})
        spec = item.get("spec", {})
        status = item.get("status", {})

        tmpl_labels = (
            spec.get("template", {}).get("metadata", {}).get("labels", {})
        )
        # Its a serving replica source if either:
        #   * its pod template is labelled inferenceServing=true OR
        #   * it is the FMA requester Deployment (llm-d.ai/role=requester).
        is_serving = tmpl_labels.get("llm-d.ai/inferenceServing") == "true"
        is_fma_requester = tmpl_labels.get("llm-d.ai/role") == "requester"
        if not (is_serving or is_fma_requester):
            continue

        # Filter by model if LLMDBENCH_HARNESS_STACK_NAME is set
        model = tmpl_labels.get("llm-d.ai/model", tmpl_labels.get("app", ""))
        if model_filter and model != model_filter:
            continue

        snapshot["controllers"].append({
            "name": metadata.get("name", ""),
            "kind": kind,
            "model": model,
            "role": tmpl_labels.get("llm-d.ai/role", "unknown"),
            "desired_replicas": spec.get("replicas", 0),
            "ready_replicas": status.get("readyReplicas", 0),
            "available_replicas": status.get("availableReplicas", 0),
            "updated_replicas": status.get("updatedReplicas", 0),
        })

    # Write latest snapshot (backward compatible)
    with open(output_file, "w") as f:
        json.dump(snapshot, f, indent=2)

    # Append to time series (every snapshot, so the graph always renders)
    ts_data = {"snapshots": []}
    if os.path.exists(ts_file):
        try:
            with open(ts_file) as f:
                ts_data = json.load(f)
        except (json.JSONDecodeError, OSError):
            ts_data = {"snapshots": []}

    ts_data["snapshots"].append(snapshot)
    changed = True
    if len(ts_data["snapshots"]) >= 2:
        prev = ts_data["snapshots"][-2]
        prev_counts = {c["name"]: c.get("ready_replicas", 0) for c in prev.get("controllers", [])}
        curr_counts = {c["name"]: c.get("ready_replicas", 0) for c in snapshot.get("controllers", [])}
        changed = prev_counts != curr_counts

    with open(ts_file, "w") as f:
        json.dump(ts_data, f, indent=2)

    print("Replica status: %d controller(s), %d snapshots%s" % (
        len(snapshot["controllers"]), len(ts_data["snapshots"]),
        "" if changed else " (unchanged)"))
    ' 2>>"$debug_log"
        if [[ $? -ne 0 ]]; then
            echo "Warning: Failed to collect replica status (see $debug_log)" >&2
        fi
    }

    # Collect pod startup times incrementally (detects newly-scaled pods).
    collect_pod_startup_times() {
        local namespace="${LLMDBENCH_VLLM_COMMON_NAMESPACE:-default}"
        local kubectl_cmd="${KUBECTL_CMD:-kubectl}"
        local output_file="$METRICS_DIR/processed/pod_startup_times.json"
        local debug_log="$METRICS_DIR/raw/collection_debug.log"

        mkdir -p "$METRICS_DIR/processed" "$METRICS_DIR/raw"

        # Serving pods (modelservice decode / FMA launcher) carry inferenceServing=true.
        local pods_json
        pods_json=$($kubectl_cmd --namespace "$namespace" get pods \
            -l llm-d.ai/inferenceServing=true \
            --field-selector=status.phase=Running \
            -o json 2>>"$debug_log") || pods_json='{"items":[]}'

        local count
        count=$(echo "$pods_json" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('items',[])))" 2>>"$debug_log" || echo 0)
        if [[ "$count" == "0" ]]; then
            pods_json=$($kubectl_cmd --namespace "$namespace" get pods \
                -l stood-up-via=standalone \
                --field-selector=status.phase=Running \
                -o json 2>>"$debug_log") || pods_json='{"items":[]}'
        fi

        # Also capture FMA requester pods (role=requester). Their creation->Ready is
        # the FMA "Avg pod startup": the requester's readiness gates on the bound
        # vLLM actually serving, unlike the launcher pool.
        local requester_json
        requester_json=$($kubectl_cmd --namespace "$namespace" get pods \
            -l llm-d.ai/role=requester \
            --field-selector=status.phase=Running \
            -o json 2>>"$debug_log") || requester_json='{"items":[]}'

        pods_json=$(_MC_SERVING="$pods_json" _MC_REQUESTER="$requester_json" python3 -c '
    import json, os
    items, seen = [], set()
    for env in ("_MC_SERVING", "_MC_REQUESTER"):
        try:
            d = json.loads(os.environ.get(env) or "{}")
        except json.JSONDecodeError:
            d = {}
        for it in d.get("items", []):
            n = it.get("metadata", {}).get("name", "")
            if n and n not in seen:
                seen.add(n)
                items.append(it)
    print(json.dumps({"items": items}))
    ' 2>>"$debug_log") || pods_json='{"items":[]}'

        echo "$pods_json" | _ST_OUTPUT="$output_file" python3 -c '
    import json, sys, os
    from datetime import datetime, timezone

    output_file = os.environ["_ST_OUTPUT"]

    data = json.load(sys.stdin)

    # Load existing data
    existing = {"collected_at": "", "pods": []}
    if os.path.exists(output_file):
        try:
            with open(output_file) as f:
                existing = json.load(f)
        except (json.JSONDecodeError, OSError):
            pass

    # Map pod name -> index for updating previously-seen pods
    seen_idx = {p["name"]: i for i, p in enumerate(existing.get("pods", []))}
    new_count = 0
    updated_count = 0

    def _parse_ready(status):
        """Return (ready_ts, startup_seconds) for a pod status dict."""
        creation_ts = status.get("_creation_ts", "")
        ready_ts = ""
        for cond in status.get("conditions", []):
            if cond.get("type") == "Ready" and cond.get("status") == "True":
                ready_ts = cond.get("lastTransitionTime", "")
                break
        startup_seconds = None
        if creation_ts and ready_ts:
            try:
                fmt = "%Y-%m-%dT%H:%M:%SZ"
                created = datetime.strptime(creation_ts, fmt)
                ready = datetime.strptime(ready_ts, fmt)
                startup_seconds = round((ready - created).total_seconds(), 1)
            except (ValueError, TypeError):
                pass
        return ready_ts, startup_seconds

    for item in data.get("items", []):
        metadata = item.get("metadata", {})
        pod_name = metadata.get("name", "")
        spec = item.get("spec", {})
        status = item.get("status", {})
        labels = metadata.get("labels", {})
        creation_ts = metadata.get("creationTimestamp", "")

        # Inject creation_ts so _parse_ready can compute startup_seconds
        status["_creation_ts"] = creation_ts
        ready_ts, startup_seconds = _parse_ready(status)

        if pod_name in seen_idx:
            # Update existing entry if it was missing ready_timestamp
            idx = seen_idx[pod_name]
            if not existing["pods"][idx].get("ready_timestamp") and ready_ts:
                existing["pods"][idx]["ready_timestamp"] = ready_ts
                existing["pods"][idx]["startup_seconds"] = startup_seconds
                updated_count += 1
            continue

        existing["pods"].append({
            "name": pod_name,
            "node": spec.get("nodeName", ""),
            "model": labels.get("llm-d.ai/model", labels.get("app", "")),
            "role": labels.get("llm-d.ai/role", "unknown"),
            "creation_timestamp": creation_ts,
            "ready_timestamp": ready_ts,
            "startup_seconds": startup_seconds,
        })
        seen_idx[pod_name] = len(existing["pods"]) - 1
        new_count += 1

    existing["collected_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    with open(output_file, "w") as f:
        json.dump(existing, f, indent=2)

    changes = []
    if new_count > 0:
        changes.append("%d new" % new_count)
    if updated_count > 0:
        changes.append("%d updated" % updated_count)
    if changes:
        print("Pod startup times: %s (%d total)" % (", ".join(changes), len(existing["pods"])))
    ' 2>>"$debug_log"
        if [[ $? -ne 0 ]]; then
            echo "Warning: Failed to collect pod startup times (see $debug_log)" >&2
        fi
    }

    # ---------------------------------------------------------------------------
    # Prometheus metrics scraping
    # ---------------------------------------------------------------------------

    # Retrieve bearer token for EPP metrics endpoint (cached after first call).
    # The upstream inferencepool chart requires auth by default; the token is
    # stored in a Kubernetes secret created alongside the EPP deployment.
    _get_epp_auth_header() {
        if [[ -n "$_EPP_AUTH_HEADER" ]]; then
            echo "$_EPP_AUTH_HEADER"
            return
        fi
        local namespace="${LLMDBENCH_VLLM_COMMON_NAMESPACE:-default}"
        local kubectl_cmd="${KUBECTL_CMD:-kubectl}"
        local token
        token=$($kubectl_cmd get secret "$EPP_METRICS_SECRET" \
            --namespace "$namespace" \
            -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null) || true
        if [[ -n "$token" ]]; then
            _EPP_AUTH_HEADER="Authorization: Bearer $token"
        fi
        echo "$_EPP_AUTH_HEADER"
    }

    # Scrape Prometheus /metrics from a single pod.
    # Usage: _scrape_pod <pod_name> <pod_ip> <timestamp> <output_file> <port> <source_tag> [<fallback_port>] [<auth_header>]
    _scrape_pod() {
        local pod_name="$1"
        local pod_ip="$2"
        local timestamp="$3"
        local output_file="$4"
        local port="$5"
        local source_tag="$6"
        local fallback_port="${7:-}"
        local auth_header="${8:-}"
        local debug_log="$METRICS_DIR/raw/collection_debug.log"
        local tmp_file="${output_file}.tmp"

        # Build curl auth args
        local -a curl_auth=()
        if [[ -n "$auth_header" ]]; then
            curl_auth=(-H "$auth_header")  # pragma: allowlist secret
        fi

        # Write header
        {
            echo "# Timestamp: $timestamp"
            echo "# Pod: $pod_name"
            echo "# PodIP: $pod_ip"
            echo "# Source: $source_tag"
            echo ""
        } > "$output_file"

        # Try primary port
        local url="http://${pod_ip}:${port}${METRICS_PATH}"
        local rc=0
        curl -sS --connect-timeout 5 --max-time "$METRICS_CURL_TIMEOUT" \
            "${curl_auth[@]+"${curl_auth[@]}"}" \
            "$url" > "$tmp_file" 2>>"$debug_log" || rc=$?

        if [[ $rc -ne 0 ]]; then
            echo "  [$(date -u +%H:%M:%S)] curl failed (rc=$rc) for ${pod_name} ${url}" >> "$debug_log"
        fi

        # Check for auth failure (HTTP 401/403 body) and retry without auth
        if [[ -s "$tmp_file" ]] && head -1 "$tmp_file" | grep -qiE '^(Unauthorized|Forbidden)$'; then
            echo "  [$(date -u +%H:%M:%S)] Auth rejected for ${pod_name}, retrying without auth" >> "$debug_log"
            rc=0
            curl -sS --connect-timeout 5 --max-time "$METRICS_CURL_TIMEOUT" \
                "$url" > "$tmp_file" 2>>"$debug_log" || rc=$?
        fi

        # Try fallback port if primary failed/empty
        if [[ ! -s "$tmp_file" && -n "$fallback_port" && "$port" != "$fallback_port" ]]; then
            url="http://${pod_ip}:${fallback_port}${METRICS_PATH}"
            echo "  [$(date -u +%H:%M:%S)] Retrying ${pod_name} on fallback port: ${url}" >> "$debug_log"
            rc=0
            curl -sS --connect-timeout 5 --max-time "$METRICS_CURL_TIMEOUT" \
                "${curl_auth[@]+"${curl_auth[@]}"}" \
                "$url" > "$tmp_file" 2>>"$debug_log" || rc=$?
            if [[ $rc -ne 0 ]]; then
                echo "  [$(date -u +%H:%M:%S)] curl failed (rc=$rc) for ${pod_name} ${url}" >> "$debug_log"
            fi
        fi

        # Append content or warning
        if [[ -s "$tmp_file" ]]; then
            cat "$tmp_file" >> "$output_file"
        else
            echo "# Warning: Failed to collect metrics from pod $pod_name ($pod_ip)" >> "$output_file"
        fi
        echo "" >> "$output_file"

        rm -f "$tmp_file"
        return 0
    }

    # Collect metrics snapshot from all vLLM and EPP pods
    collect_metrics_snapshot() {
        local namespace="${LLMDBENCH_VLLM_COMMON_NAMESPACE:-default}"
        local timestamp=$(date +%s)
        local iso_timestamp=$(date -u +"%Y-%m-%dT%H:%M:%S%z")

        echo "Collecting metrics at $iso_timestamp"
        echo "Namespace: $namespace"

        # Collect vLLM pod metrics
        local pod_info
        pod_info=$(get_pod_info "$namespace")

        if [[ -z "$pod_info" ]]; then
            echo "Warning: No running vLLM pods found in namespace $namespace" >&2
        else
            echo "Found vLLM pods:"
            echo "$pod_info"

            echo "$pod_info" | while read -r pod_name pod_ip; do
                [[ -z "$pod_ip" || -z "$pod_name" ]] && continue
                _scrape_pod "$pod_name" "$pod_ip" "$iso_timestamp" \
                    "$METRICS_DIR/raw/${pod_name}_${timestamp}_metrics.log" \
                    "$METRICS_PORT" "prometheus_metrics" "$INFERENCE_PORT" &
            done
        fi

        # Collect EPP pod metrics
        local epp_info
        epp_info=$(get_epp_pod_info "$namespace")

        if [[ -n "$epp_info" ]]; then
            echo "Found EPP pods:"
            echo "$epp_info"

            local epp_auth
            epp_auth=$(_get_epp_auth_header)

            echo "$epp_info" | while read -r pod_name pod_ip; do
                [[ -z "$pod_ip" || -z "$pod_name" ]] && continue
                _scrape_pod "$pod_name" "$pod_ip" "$iso_timestamp" \
                    "$METRICS_DIR/raw/${pod_name}_${timestamp}_metrics.log" \
                    "$EPP_METRICS_PORT" "epp_prometheus_metrics" "" "$epp_auth" &
            done
        fi

        # Wait for all background collections to finish
        wait
    }

    # ---------------------------------------------------------------------------
    # Collection lifecycle
    # ---------------------------------------------------------------------------

    # Start continuous collection in background
    start_continuous_collection() {
        local duration="${1:-0}"  # 0 means run until stopped

        init_metrics_dir

        echo "Starting continuous metrics collection (interval: ${COLLECTION_INTERVAL}s)"
        echo $$ > "$METRICS_DIR/collector.pid"

        local start_time=$(date +%s)
        local iterations=0

        while true; do
            # Collect infrastructure state every iteration to track autoscaling
            collect_replica_status
            collect_pod_startup_times

            # Collect Prometheus metrics from all pods
            collect_metrics_snapshot
            iterations=$((iterations + 1))

            # Check if we should stop (duration exceeded)
            if [[ $duration -gt 0 ]]; then
                local current_time=$(date +%s)
                local elapsed=$((current_time - start_time))
                if [[ $elapsed -ge $duration ]]; then
                    echo "Collection duration reached ($duration seconds), stopping"
                    break
                fi
            fi

            sleep "$COLLECTION_INTERVAL"
        done

        echo "Collected $iterations snapshots"
        rm -f "$METRICS_DIR/collector.pid"
    }

    # Stop continuous collection
    stop_continuous_collection() {
        if [[ -f "$METRICS_DIR/collector.pid" ]]; then
            local pid=$(cat "$METRICS_DIR/collector.pid")
            if kill -0 "$pid" 2>/dev/null; then
                echo "Stopping metrics collector (PID: $pid)"
                kill "$pid"
                rm -f "$METRICS_DIR/collector.pid"
            fi
        fi
    }

    # Parse and aggregate collected logs
    process_collected_metrics() {
        echo "Processing collected logs..."
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        METRICS_DIR="$METRICS_DIR" python3 "${SCRIPT_DIR}/process_metrics.py"
    }

    # Main command dispatcher
    case "${1:-}" in
        start)
            start_continuous_collection "${2:-0}"
            ;;
        stop)
            stop_continuous_collection
            ;;
        snapshot)
            init_metrics_dir
            collect_metrics_snapshot
            collect_replica_status
            collect_pod_startup_times
            ;;
        process)
            process_collected_metrics
            ;;
        *)
            echo "Usage: $0 {start [duration]|stop|snapshot|process}"
            echo "  start [duration]  - Start continuous collection (optional duration in seconds)"
            echo "  stop              - Stop continuous collection"
            echo "  snapshot          - Collect a single snapshot"
            echo "  process           - Process and aggregate collected metrics"
            exit 1
            ;;
    esac
  dpc_log_parser.py: |
    """Parse DPC (dual-pods-controller) klog output to extract per-request timing.

    The DPC emits two kinds of structured klog lines:
    1. "HTTP call done" lines at V(5) with a purpose="<token>" field identifying the
       HTTP call type (purpose tokens: "wake", "create_instance", "relay_ready", etc.).
       Each line includes httpCallStartTime field.
    2. "Created launcher-based server-providing pod" lines at V(2) for cold-launcher
       starts, with k8sCallStartTime field.

    This module correlates these timestamps by requesterName to produce per-request
    timing records. Only specific purposes are tracked: "wake" (hot-start anchor),
    "create_instance" (warm-start anchor), "relay_ready" (readiness end time).
    Other purposes and relay_unready are ignored.
    """

    import glob
    import logging
    import os
    import re
    from dataclasses import dataclass
    from datetime import datetime
    from typing import Iterable, Optional

    logger = logging.getLogger(__name__)

    # klog structured field patterns (key="value" pairs)
    _FIELD_RE = re.compile(r'(\w+)="([^"]*)"')

    # Log messages we care about (DPC indicators)
    _HTTP_CALL_DONE_MSG = "HTTP call done"
    _CREATE_LAUNCHER_POD_MSG = "Created launcher-based server-providing pod"

    _DPC_INDICATOR_MSGS = (
        _HTTP_CALL_DONE_MSG,
        _CREATE_LAUNCHER_POD_MSG,
    )


    def _parse_rfc3339_nano(s: str) -> Optional[float]:
        """Parse RFC3339Nano timestamp string to Unix epoch float (seconds)."""
        if not s:
            return None
        try:
            dt = datetime.fromisoformat(s.replace("Z", "+00:00"))
            return dt.timestamp()
        except (ValueError, TypeError):
            return None


    @dataclass
    class DPCTimingRecord:
        """Timing anchors for a single requester pod, extracted from DPC logs."""

        requester_name: str
        relay_readiness_time: Optional[float] = None
        wake_start_time: Optional[float] = None
        instance_create_start_time: Optional[float] = None
        launcher_create_start_time: Optional[float] = None

        def t_hot(self) -> Optional[float]:
            """T_hot: relay_readiness - wake_start (seconds)."""
            if self.relay_readiness_time is not None and self.wake_start_time is not None:
                return self.relay_readiness_time - self.wake_start_time
            return None

        def t_instance_create(self) -> Optional[float]:
            """T_instance_create: relay_readiness - instance_create_start (seconds)."""
            if (
                self.relay_readiness_time is not None
                and self.instance_create_start_time is not None
            ):
                return self.relay_readiness_time - self.instance_create_start_time
            return None

        def t_cold_launcher(self) -> Optional[float]:
            """T_cold_launcher: relay_readiness - launcher_create_start (seconds)."""
            if (
                self.relay_readiness_time is not None
                and self.launcher_create_start_time is not None
            ):
                return self.relay_readiness_time - self.launcher_create_start_time
            return None


    def parse_dpc_log(lines: Iterable[str]) -> dict[str, DPCTimingRecord]:
        """Parse DPC log lines and return timing records keyed by requester pod name.

        Accepts any iterable of strings (list, file object, generator) to support
        both in-memory and streaming use without loading the entire file at once.

        Lines without a requesterName field or without a recognized timing message
        are skipped.

        Args:
            lines: Iterable of log line strings.

        Returns:
            Dict mapping requester pod name to its DPCTimingRecord.
        """
        records: dict[str, DPCTimingRecord] = {}

        for line in lines:
            if not any(msg in line for msg in _DPC_INDICATOR_MSGS):
                continue

            fields = dict(_FIELD_RE.findall(line))

            requester_name = fields.get("requesterName")
            if not requester_name:
                continue

            if requester_name not in records:
                records[requester_name] = DPCTimingRecord(requester_name=requester_name)
            rec = records[requester_name]

            # Handle centralized "HTTP call done" line with purpose-based dispatch
            if _HTTP_CALL_DONE_MSG in line:
                purpose = fields.get("purpose", "")
                ts = _parse_rfc3339_nano(fields.get("httpCallStartTime", ""))

                if purpose == "wake":
                    if ts is not None:
                        rec.wake_start_time = ts
                elif purpose == "create_instance":
                    if ts is not None:
                        rec.instance_create_start_time = ts
                elif purpose == "relay_ready":
                    if ts is not None:
                        rec.relay_readiness_time = ts
                # else: ignore relay_unready, sleep, query_sleeping, etc.

            # Handle cold-launcher start
            elif _CREATE_LAUNCHER_POD_MSG in line:
                ts = _parse_rfc3339_nano(fields.get("k8sCallStartTime", ""))
                if ts is not None:
                    rec.launcher_create_start_time = ts

        return records


    def _is_dpc_log_file(filepath: str) -> bool:
        """Check if a file is a DPC log by streaming for any indicator message.

        Streams line-by-line and returns as soon as an indicator message is found,
        so it is cheap for real DPC logs (the first indicator may appear well past
        the start, after controller startup noise) and only reads to EOF for a
        non-DPC log.
        """
        try:
            with open(filepath, "r", encoding="utf-8", errors="replace") as f:
                for line in f:
                    if any(msg in line for msg in _DPC_INDICATOR_MSGS):
                        return True
        except OSError:
            return False
        return False


    def parse_dpc_log_file(requests_dir: str) -> dict[str, DPCTimingRecord]:
        """Find and parse DPC controller log file(s) in the requests directory.

        Streams the file line-by-line to handle arbitrarily large logs without
        loading the entire content into memory.

        The log file is written by write_controller_log() with the naming pattern:
        <pod-name>--<container-name>.log. We identify DPC logs by streaming for any
        timing-relevant message (handles the case where requesters crashed before
        relay and the log only contains start events, and the case where the first
        indicator message appears far into a large log after controller startup
        noise).

        Args:
            requests_dir: Directory where controller logs were saved.

        Returns:
            Dict mapping requester pod name to its DPCTimingRecord.
            Returns empty dict if directory doesn't exist or no DPC log found.
        """
        if not os.path.isdir(requests_dir):
            logger.warning("DPC log directory does not exist: %s", requests_dir)
            return {}

        log_files = glob.glob(os.path.join(requests_dir, "*.log"))
        if not log_files:
            logger.debug("No .log files found in %s", requests_dir)
            return {}

        all_records: dict[str, DPCTimingRecord] = {}
        for log_file in log_files:
            if not _is_dpc_log_file(log_file):
                continue

            logger.info("Parsing DPC log for timing: %s", log_file)
            try:
                with open(log_file, "r", encoding="utf-8", errors="replace") as f:
                    records = parse_dpc_log(f)
                all_records.update(records)
            except OSError as e:
                logger.warning("Failed to read log file %s: %s", log_file, e)

        return all_records
  eval-containers-llm-d-benchmark.sh: |
    #!/usr/bin/env bash
    #
    # eval-containers harness: runs ONE eval-containers task per parallel harness pod
    # against the deployed llm-d endpoint, so a benchmark fans out with -j <#tasks>.
    # Set harness.entrypoint to this script -- the eval image has no load-generator
    # entrypoint of its own.
    #
    set -euo pipefail

    # --- which task does this pod run? -------------------------------------------
    # llm-d-benchmark fans -j N pods over a treatment and gives each pod its own
    # results dir suffixed _<idx> (1..N); there is no per-pod index env var, so
    # recover the 1-based index from that suffix. eval-containers task ids are
    # 0-based. EVAL_TASK_OFFSET runs a big dataset in capacity-sized waves
    # (wave k: -j size, EVAL_TASK_OFFSET=k*size).
    results_dir="${LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR:?must be set by llm-d-benchmark}"
    mkdir -p "$results_dir"
    if [[ -z "${EVAL_TASK_ID:-}" ]]; then
      idx="${LLMDBENCH_RUN_EXPERIMENT_PARALLEL_INDEX:-${results_dir##*_}}"
      # parallel_idx is 1-based (framework: range(1, N+1)); fall back to 1 for a
      # missing / non-numeric / zero suffix so EVAL_TASK_ID can never go negative.
      case "$idx" in ''|*[!0-9]*|0) idx=1 ;; esac
      export EVAL_TASK_ID="$(( idx - 1 + ${EVAL_TASK_OFFSET:-0} ))"
    fi

    # --- point the eval's in-pod model gateway at the deployed llm-d endpoint -----
    # Single-image (standalone) mode: leaving ANTHROPIC_BASE_URL unset makes the
    # eval start its own otel+gateway+agent+verifier pipeline in this pod; that
    # in-pod gateway reads its upstream from OPENAI_API_BASE + EVAL_MODEL, so the
    # agent's LLM calls land on the deployed llm-d model.
    endpoint="${LLMDBENCH_HARNESS_STACK_ENDPOINT_URL:?endpoint not provided}"
    endpoint="${endpoint%/}"
    # The in-pod gateway (bifrost) is an OpenAI-compatible client: it appends the
    # `/v1/chat/completions` path itself, so its upstream base must be the ROOT, not
    # `.../v1` (a `/v1` suffix would double to `.../v1/v1/...` -> upstream 404).
    endpoint="${endpoint%/v1}"
    export OPENAI_API_BASE="$endpoint"
    export OPENAI_API_KEY="${OPENAI_API_KEY:-sk-llm-d}"  # pragma: allowlist secret (placeholder; llm-d ignores it)
    export EVAL_MODEL="openai/${LLMDBENCH_DEPLOY_CURRENT_MODEL:?model not provided}"

    echo "eval-containers: task=$EVAL_TASK_ID model=$EVAL_MODEL endpoint=$OPENAI_API_BASE"

    # --- run the eval ------------------------------------------------------------
    # image ENTRYPOINT stages /app for EVAL_TASK_ID, then execs the pipeline.
    rc=0
    "${EVAL_CONTAINERS_ENTRYPOINT:-/entrypoint.sh}" \
      "${EVAL_CONTAINERS_RUN:-/usr/local/bin/run}" || rc=$?

    # --- hand results back to llm-d-benchmark's collector ------------------------
    output_dir="${EVAL_OUTPUT_DIR:-/output}"
    if [[ -d "$output_dir" ]]; then cp -a "$output_dir/." "$results_dir/"; fi
    # Escape free text for the double-quoted YAML scalars below. Backslash first, or
    # the quote escapes get double-escaped. Control characters are illegal in a
    # double-quoted scalar at all, and an unparseable file loses every key in it, not
    # just this one.
    _yaml_escape() {
      local text="${1:-}" out="" index character
      text="${text//\\/\\\\}"
      text="${text//\"/\\\"}"
      text="${text//$'\t'/\\t}"
      text="${text//$'\n'/\\n}"
      for (( index=0; index<${#text}; index++ )); do
        character="${text:index:1}"
        if [[ "$character" == [[:cntrl:]] ]]; then
          printf -v character '\\x%02x' "'$character"
        fi
        out+="$character"
      done
      printf '%s' "$out"
    }
    _description_text="$(_yaml_escape "${LLMDBENCH_DESCRIPTION_TEXT:-}")"
    _description_keywords="$(_yaml_escape "${LLMDBENCH_DESCRIPTION_KEYWORDS:-}")"
    printf 'harness_name: eval-containers\nharness_rc: %s\ntask_id: %s\nmodel: %s\nexperiment_id: "%s"\ndescription_text: "%s"\ndescription_keywords: "%s"\n' \
      "$rc" "$EVAL_TASK_ID" "$EVAL_MODEL" "${LLMDBENCH_RUN_EXPERIMENT_ID:-}" \
      "$_description_text" "$_description_keywords" \
      > "$results_dir/run_metadata.yaml"

    exit "$rc"
