                [
                    "LLMDBENCH_VLLM_STANDALONE_LAUNCHER_PORT",
                    "LLMDBENCH_VLLM_STANDALONE_LAUNCHER_VLLM_PORT",
                ]
            )
        if fma_enabled:
            keys.extend(
