apiVersion: v1
kind: Namespace
metadata:
  name: llm-inference
  labels:
    kubernetes.io/metadata.name: llm-inference
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
spec:
  finalizers:
  - kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-perf-runner
  namespace: llm-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-perf-job-creator
  namespace: llm-inference
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
# Allow the metrics collector (collect_metrics.sh) to read the EPP
# metrics-reader Secret so it can present its bearer token when scraping
# the EPP /metrics endpoint (authn/authz filter is on by default).
# Scoped by resourceName to just that Secret (least privilege).
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["inference-gateway-sa-metrics-reader-secret"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-perf-job-creator-binding
  namespace: llm-inference
subjects:
- kind: ServiceAccount
  name: inference-perf-runner
  namespace: llm-inference
roleRef:
  kind: Role
  name: inference-perf-job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-perf-restricted-scc
  namespace: llm-inference
subjects:
- kind: ServiceAccount
  name: inference-perf-runner
  namespace: llm-inference
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:restricted
  apiGroup: rbac.authorization.k8s.io
