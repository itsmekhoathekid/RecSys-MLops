# Keep the installation intentionally small while retaining the real sandbox
# WorkerPool used by the repository-owned SandboxAgent.
kmcp:
  enabled: false

# Quota-safe requests for the coursework GKE cluster. Limits retain burst room.
database:
  postgres:
    bundled:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    ateApiInsecure: true
    atenetRouterURL: http://atenet-router.ate-system.svc:80
    defaultWorkerPool:
      name: recsys-context-sandbox-pool

substrateWorkerPool:
  create: true
  name: recsys-context-sandbox-pool
  # Terraform/kagent owns this required baseline. The application-owned KEDA
  # ScaledObject reconciles the WorkerPool /scale subresource between 1 and 3.
  replicas: 1
  ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.6
  sandboxClass: gvisor

ui:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kagent-tools:
  enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen3.5-0.8b
    apiKeySecretRef: kagent-agent-gateway
    apiKeySecretKey: AGENT_GATEWAY_API_KEY
    defaultHeaders:
      X-Gateway-Base-Model-Name: llm-d-optimized-baseline
    config:
      baseUrl: http://llm-d-inference-gateway.llm-inference.svc.cluster.local/v1
      # Bound CPU inference latency and prevent small-model repetition loops
      # from consuming the entire llama.cpp context window.
      maxTokens: 256

# Agents are deployed by the repository-owned recsys-kagent-agent chart. The
# upstream demo Agents and MCP servers are disabled to avoid unnecessary GKE
# resources and oversized prompts for the 16,384-token coursework runtime.
k8s-agent:
  enabled: false

kgateway-agent:
  enabled: false

istio-agent:
  enabled: false

promql-agent:
  enabled: false

observability-agent:
  enabled: false

argo-rollouts-agent:
  enabled: false

helm-agent:
  enabled: false

cilium-policy-agent:
  enabled: false

cilium-manager-agent:
  enabled: false

cilium-debug-agent:
  enabled: false

grafana-mcp:
  enabled: false

querydoc:
  enabled: false
