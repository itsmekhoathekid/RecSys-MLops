provider:
  name: agentgateway

httpRoute:
  create: true
  inferenceGatewayName: llm-d-inference-gateway

router:
  epp:
    replicas: 1
    flags:
      v: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    pluginsConfigFile: load-aware-plugins.yaml
    pluginsCustomConfig:
      load-aware-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: inflight-load-producer
            parameters:
              addEstimatedOutputTokens: true
          - type: token-load-scorer
            parameters:
              queueThresholdTokens: 32768
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: token-load-scorer
  inferencePool:
    failureMode: FailOpen
  modelServers:
    protocol: http
    matchLabels:
      llm-d.ai/guide: optimized-baseline
