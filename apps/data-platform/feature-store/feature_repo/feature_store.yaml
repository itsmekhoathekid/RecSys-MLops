project: recsys
provider: local
registry:
  registry_type: sql
  path: ${FEAST_SQL_REGISTRY_URL}
  cache_ttl_seconds: 60
  cache_mode: sync
  sqlalchemy_config_kwargs:
    pool_pre_ping: true
entity_key_serialization_version: 3

# Feast core offline store for point-in-time historical retrieval.
# Feast stores feature values in PostgreSQL and Redis; lakehouse tables are upstream only.
offline_store:
  type: postgres
  host: feature-postgres.recsys-dataflow.svc.cluster.local
  port: 5432
  database: feature_store
  db_schema: feature_store
  user: feast
  password: ${FEAST_POSTGRES_PASSWORD}
  sslmode: disable

online_store:
  type: redis
  connection_string: redis:6379
