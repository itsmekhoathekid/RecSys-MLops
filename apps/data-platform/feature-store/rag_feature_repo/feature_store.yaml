project: recsys_rag
provider: local
registry:
  registry_type: sql
  path: ${FEAST_SQL_REGISTRY_URL}
  cache_ttl_seconds: 60
  cache_mode: sync
entity_key_serialization_version: 3

offline_store:
  type: file

online_store:
  type: milvus
  host: ${MILVUS_HOST}
  port: 19530
  username: ${MILVUS_USERNAME}
  password: ${MILVUS_PASSWORD}
  vector_enabled: true
  embedding_dim: 384
  index_type: FLAT
  metric_type: COSINE
  varchar_max_length: 65535
