[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-data-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "acryl-datahub>=1.6.0.17",
    "boto3==1.35.36",
    "cryptography==48.0.1",
    "evidently>=0.7.0",
    "feast[redis]==0.64.0",
    "fsspec==2024.10.0",
    "kfp>=2.16.1",
    "kubernetes>=30.1.0",
    "openlineage-python>=1.52.0",
    "jaraco.context==6.1.0",
    "pandas>=2.3.3",
    "pendulum>=3.0.0,<4",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=18.0.0",
    "pyspark==3.5.8",
    "pyyaml>=6.0.3",
    "redis>=5.0.0",
    "recsys-feature-store-runtime",
    "requests>=2.32.0",
    "s3fs==2024.10.0",
    "setuptools==81.0.0",
    "sqlalchemy==1.4.54",
    "wheel==0.46.2",
]

[tool.uv.sources]
recsys-feature-store-runtime = { path = "../../packages/recsys-feature-store-runtime", editable = true }

[dependency-groups]
dev = [
    "fastapi>=0.138.0,<1",
    "httpx>=0.28.1,<1",
    "hypothesis>=6.155.7,<7",
    "opentelemetry-api>=1.30.0,<2",
    "opentelemetry-sdk>=1.30.0,<2",
    "prometheus-client>=0.21.0,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "tritonclient[grpc]>=2.54.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
