[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-feature-rag-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28.1,<1",
  "mcp>=1.28.1,<2",
  "opentelemetry-api>=1.32,<2",
  "opentelemetry-instrumentation-fastapi>=0.53b0,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "interrogate>=1.7,<2",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
