substitutions:
  _IMAGE_REPO: asia-southeast1-docker.pkg.dev/rec-sys-503309/recsys
  _TAG: gcp
  _TRAINING_TAG: full-cicd-20260706-r1
  _SPARK_TAG: full-cicd-20260706-r1

options:
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
  - id: base-python
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.base-python
      - -t
      - ${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - .

  - id: data-ingestion
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.data-ingestion
      - -t
      - ${_IMAGE_REPO}/recsys-data-ingestion:${_TAG}
      - .

  - id: feature-store
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.feature-store
      - -t
      - ${_IMAGE_REPO}/recsys-feature-store:${_TAG}
      - .

  - id: drift-retrain
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.drift-retrain
      - -t
      - ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
      - .

  - id: validate-drift-retrain-kfp-package
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - >-
        docker run --rm ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
        bash -c "test -f /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && ! grep -F ':local' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F 'feature_source' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F 'distributed_num_workers' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F '${_IMAGE_REPO}/recsys-mlops-training:${_TRAINING_TAG}' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F '${_IMAGE_REPO}/recsys-mlops-spark:${_SPARK_TAG}' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml"

images:
  - ${_IMAGE_REPO}/recsys-base-python:${_TAG}
  - ${_IMAGE_REPO}/recsys-data-ingestion:${_TAG}
  - ${_IMAGE_REPO}/recsys-feature-store:${_TAG}
  - ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
