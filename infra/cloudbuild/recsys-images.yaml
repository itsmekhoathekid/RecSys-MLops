substitutions:
  _IMAGE_REPO: asia-southeast1-docker.pkg.dev/rec-sys-503309/recsys
  _TAG: gcp

options:
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

steps:
  - id: base-python
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.base-python
      - -t
      - ${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - .

  - id: training
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/ml-system/Dockerfile.training
      - -t
      - ${_IMAGE_REPO}/recsys-mlops-training:${_TAG}
      - .

  - id: api-serving
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api-serving/Dockerfile
      - -t
      - ${_IMAGE_REPO}/recsys-api-serving:${_TAG}
      - .

  - id: kafka-connect
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.kafka-connect
      - -t
      - ${_IMAGE_REPO}/recsys-kafka-connect:${_TAG}
      - .

  - id: mlflow
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.mlflow
      - -t
      - ${_IMAGE_REPO}/recsys-mlflow:${_TAG}
      - .

  - id: airflow
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.airflow
      - -t
      - ${_IMAGE_REPO}/recsys-airflow:${_TAG}
      - .

  - id: spark
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/data-platform/Dockerfile.spark
      - -t
      - ${_IMAGE_REPO}/recsys-spark:${_TAG}
      - .

  - id: mlops-spark
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_SPARK_BASE_IMAGE=${_IMAGE_REPO}/recsys-spark:${_TAG}
      - -f
      - apps/ml-system/Dockerfile.spark
      - -t
      - ${_IMAGE_REPO}/recsys-mlops-spark:${_TAG}
      - .

  - id: compile-kfp-package
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - -v
      - /workspace:/workspace
      - -w
      - /workspace
      - -e
      - KFP_CICD_PYTHON=/opt/venv/bin/python
      - -e
      - KFP_UPLOAD_PACKAGE=0
      - -e
      - RECSYS_PIPELINE_IMAGE=${_IMAGE_REPO}/recsys-mlops-training:${_TAG}
      - -e
      - RECSYS_RAY_IMAGE=${_IMAGE_REPO}/recsys-mlops-training:${_TAG}
      - -e
      - RECSYS_SPARK_IMAGE=${_IMAGE_REPO}/recsys-mlops-spark:${_TAG}
      - ${_IMAGE_REPO}/recsys-mlops-training:${_TAG}
      - bash
      - jenkins/scripts/kubeflow_pipeline_cicd.sh

  - id: data-ingestion
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.data-ingestion
      - -t
      - ${_IMAGE_REPO}/recsys-data-ingestion:${_TAG}
      - .

  - id: feature-store
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.feature-store
      - -t
      - ${_IMAGE_REPO}/recsys-feature-store:${_TAG}
      - .

  - id: drift-retrain
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_BASE_IMAGE=${_IMAGE_REPO}/recsys-base-python:${_TAG}
      - -f
      - apps/data-platform/Dockerfile.drift-retrain
      - -t
      - ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
      - .

  - id: validate-drift-retrain-kfp-package
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - >-
        docker run --rm ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
        bash -c "test -f /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && ! grep -F ':local' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F '${_IMAGE_REPO}/recsys-mlops-training:${_TAG}' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml
        && grep -F '${_IMAGE_REPO}/recsys-mlops-spark:${_TAG}' /opt/recsys/infra/kubeflow/compiled/bst_training_pipeline.yaml"

  - id: demo-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/demo-web/backend/Dockerfile
      - -t
      - ${_IMAGE_REPO}/recsys-demo-api:${_TAG}
      - .

  - id: demo-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/demo-web/frontend/Dockerfile
      - -t
      - ${_IMAGE_REPO}/recsys-demo-web:${_TAG}
      - .

  - id: flink
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/data-platform/Dockerfile.flink
      - -t
      - ${_IMAGE_REPO}/recsys-flink:${_TAG}
      - .

  - id: analytics-spark
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RECSYS_SPARK_BASE_IMAGE=${_IMAGE_REPO}/recsys-spark:${_TAG}
      - -f
      - apps/analytics/Dockerfile.spark
      - -t
      - ${_IMAGE_REPO}/recsys-analytics-spark:${_TAG}
      - .

  - id: analytics-dbt
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/analytics/Dockerfile.dbt
      - -t
      - ${_IMAGE_REPO}/recsys-analytics-dbt:${_TAG}
      - .

  - id: analytics-superset
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/analytics/Dockerfile.superset
      - -t
      - ${_IMAGE_REPO}/recsys-analytics-superset:${_TAG}
      - .

images:
  - ${_IMAGE_REPO}/recsys-base-python:${_TAG}
  - ${_IMAGE_REPO}/recsys-data-ingestion:${_TAG}
  - ${_IMAGE_REPO}/recsys-feature-store:${_TAG}
  - ${_IMAGE_REPO}/recsys-drift-retrain:${_TAG}
  - ${_IMAGE_REPO}/recsys-mlops-training:${_TAG}
  - ${_IMAGE_REPO}/recsys-api-serving:${_TAG}
  - ${_IMAGE_REPO}/recsys-demo-api:${_TAG}
  - ${_IMAGE_REPO}/recsys-demo-web:${_TAG}
  - ${_IMAGE_REPO}/recsys-kafka-connect:${_TAG}
  - ${_IMAGE_REPO}/recsys-mlflow:${_TAG}
  - ${_IMAGE_REPO}/recsys-airflow:${_TAG}
  - ${_IMAGE_REPO}/recsys-spark:${_TAG}
  - ${_IMAGE_REPO}/recsys-mlops-spark:${_TAG}
  - ${_IMAGE_REPO}/recsys-flink:${_TAG}
  - ${_IMAGE_REPO}/recsys-analytics-spark:${_TAG}
  - ${_IMAGE_REPO}/recsys-analytics-dbt:${_TAG}
  - ${_IMAGE_REPO}/recsys-analytics-superset:${_TAG}
