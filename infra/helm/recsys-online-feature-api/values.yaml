namespace: api-serving
name: recsys-online-feature-api
image: registry.example.invalid/recsys/recsys-online-feature-api:required
imagePullPolicy: IfNotPresent
replicas: 1
rollout:
  maxSurge: 1
  maxUnavailable: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 120
service:
  port: 80
  targetPort: 8080
config:
  redisHost: redis.recsys-dataflow.svc.cluster.local
  redisPort: "6379"
  feastRepoPath: /opt/recsys/apps/data-platform/feature-store/feature_repo
  feastRuntimeRepoPath: /tmp/recsys-feast-feature-repo
  feastApplyOnStartup: "0"
  feastPostgresHost: feature-postgres.recsys-dataflow.svc.cluster.local
  feastPostgresPort: "5432"
  feastPostgresDatabase: feature_store
  feastPostgresSchema: feature_store
  feastPostgresSslmode: disable
  feastPostgresUser: feast
  feastPostgresPassword: feast
  warmupOnStartup: "1"
  forceNotReady: "0"
  allowFeatureFallback: "0"
  jsonLogs: "1"
  otelEnabled: "1"
  otelServiceName: recsys-online-feature-api
  otelEndpoint: http://recsys-tempo.observability.svc.cluster.local:4317
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
istio: {proxyCPU: 50m, proxyMemory: 64Mi}
nodeSelector: {}
tolerations: []
observability:
  serviceMonitor: {enabled: true, interval: 15s}
autoscaling:
  enabled: true
  scaledObjectName: recsys-online-feature-api-prometheus
  serverAddress: http://recsys-prometheus.observability.svc.cluster.local:9090
  pollingInterval: 10
  cooldownPeriod: 120
  restoreToOriginalReplicaCount: true
  hpaName: recsys-online-feature-api
  minReplicas: 1
  maxReplicas: 3
  serviceLabel: recsys-online-feature-api
  route: /online-features
  method: POST
  requestRate: {targetValue: "5", activationThreshold: "1", window: 1m}
  latency: {targetValue: "0.12", activationThreshold: "0.03", window: 1m}
