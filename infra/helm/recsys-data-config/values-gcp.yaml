storageClassName: standard-rwo

images:
  pullPolicy: IfNotPresent

sourcePostgres:
  storage: 20Gi

kafkaConnect:
  istioInject: "true"

airflowPostgres:
  storage: 5Gi

minio:
  storage: 20Gi

airflow:
  dp1Schedule: "@daily"
  dp2Schedule: "0 1 * * *"
  dp3Schedule: "30 1 * * *"
  ragItemSchedule: "0 2 * * *"
  analyticsSchedule: "30 2 * * *"
  feastMaterializeSchedule: "20 */2 * * *"
  featureDriftSchedule: "30 3 * * *"

rag:
  # Canonical fallback artifact verified by the successful
  # rag-index-fallback96-20260823 Airflow run.
  sourceRunId: rag-source-quota-fallback96-20260823
  pipelineRunId: rag-pipeline-fallback96-20260823

dataSetup:
  generatorConfig: configs/data-platform/generator/e2e-2k.yaml
  generatorRunId: test_2k_seed42
  dp3Config: configs/data-platform/spark/dp3-e2e-2k.yaml
  realtimeLimitPerTable: "1000"

spark:
  driverMemory: 1g
  driverMemoryOverhead: 512m
  driverCores: "1"
  driverRequestCores: 100m
  executorInstances: "1"
  executorMemory: 1g
  executorMemoryOverhead: 512m
  executorCores: "1"
  executorRequestCores: 100m
  dynamicAllocation:
    enabled: true
    shuffleTrackingEnabled: true
    minExecutors: "1"
    initialExecutors: "1"
    maxExecutors: "4"
    executorIdleTimeout: 60s
    schedulerBacklogTimeout: 1s
    sustainedSchedulerBacklogTimeout: 1s
  sqlShufflePartitions: "16"

realtimeProducer:
  replicas: 0

flinkTaskManager:
  # Isolate the online and offline streaming workloads across two TaskManagers.
  replicas: 2
  resources:
    requests:
      cpu: 300m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi

flink:
  istioInject: "true"
  # One slot per TaskManager guarantees the online and offline jobs are isolated.
  taskSlots: "1"
  taskManagerProcessMemory: 4096m
  taskManagerTaskHeapMemory: 2048m
  taskManagerManagedMemory: 512m
  taskManagerJvmOverheadMax: 1024m

flinkAutoscaler:
  taskManagerHpa:
    # Reserve enough CPU-pool memory for one concurrent Spark driver/executor pair.
    maxReplicas: 2

redis:
  istioInject: "true"

realtimeFlinkConsumer:
  replicas: 1
  istioInject: "true"
  parallelism: "1"
  checkpointIntervalSeconds: "300"
  offlineStoreEnabled: true
  online:
    # Resume normal rollouts without replaying the full CDC topic. The source
    # falls back to EARLIEST only when a fresh group has no committed offset.
    startingOffsets: committed-offsets

streaming:
  # The proof workload backdates events by 45-180 minutes; one hour yields
  # both accepted-late and post-cleanup events for the three UI counters.
  allowedLatenessSeconds: 3600
  # Recent RocksDB checkpoints reached ~272s on the in-cluster MinIO store.
  # Give checkpoints enough time to finish instead of repeatedly restarting jobs.
  checkpointTimeoutSeconds: 900

drift:
  sampleRows: "5000"
