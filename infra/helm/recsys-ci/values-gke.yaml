namespace:
  create: false

productionTarget:
  enabled: true
  projectId: recsys-mlops-506406
  region: asia-southeast1
  zone: asia-southeast1-b
  cluster: recsys-mlops-gke
  context: gke_recsys-mlops-506406_asia-southeast1-b_recsys-mlops-gke
  imageRegistry: asia-southeast1-docker.pkg.dev/recsys-mlops-506406/recsys

jenkins:
  nodeSelector:
    recsys.ai/pool: cpu-services
  tolerations: []
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      # Full KFP package compilation briefly peaks above 2 GiB while uv links
      # the locked ML environment. Keep enough headroom to avoid cgroup
      # allocation failures without increasing the scheduler reservation.
      memory: 8Gi
  runtimeCredentialsSecret:
    enabled: true
  dind:
    # Reuse Jenkins home for Docker graph data so GKE provisions one CI disk.
    # Full releases retain large Spark/Flink/ML layers alongside Jenkins metadata,
    # so the production override keeps enough headroom for image assembly.
    useJenkinsHomePvc: true
    gc:
      keepStorage: 40GB
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
    pvc:
      enabled: false
      storage: 200Gi
      storageClassName: standard-rwo
  runtimeTools:
    installOnStartup: true
  webhookIngress:
    enabled: true
  pvc:
    volumeName: ""
    storage: 100Gi
    storageClassName: standard

modelRolloutWatcher:
  enabled: true
  # Keep the last verified immutable watcher image; the mutable `gcp` tag is
  # not published in Artifact Registry and makes a CI-only Helm upgrade stall.
  image: asia-southeast1-docker.pkg.dev/recsys-mlops-506406/recsys/recsys-mlops-training:a7ce4e4ec31e0fea5c1e4558c35012aee7b87cac
  imagePullPolicy: Always
  nodeSelector:
    recsys.ai/pool: ml-system
  tolerations:
    - key: recsys.ai/workload
      operator: Equal
      value: ml-system
      effect: NoSchedule
  autoProgressiveEnabled: true
  progressiveWeights: "10,25,50"
