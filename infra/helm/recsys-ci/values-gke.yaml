namespace:
  create: false

productionTarget:
  enabled: true
  projectId: recsys-mlops
  region: asia-southeast1
  zone: asia-southeast1-b
  cluster: recsys-mlops-gke
  context: gke_recsys-mlops_asia-southeast1-b_recsys-mlops-gke
  imageRegistry: asia-southeast1-docker.pkg.dev/recsys-mlops/recsys

jenkins:
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  runtimeCredentialsSecret:
    enabled: true
  dind:
    # Reuse Jenkins home for Docker graph data so GKE provisions one CI disk.
    # The locked ML environment peaks above 19 GiB during full releases, so the
    # production override keeps enough headroom for Jenkins metadata and reports.
    useJenkinsHomePvc: true
    pvc:
      enabled: false
      storage: 200Gi
      storageClassName: standard-rwo
  runtimeTools:
    installOnStartup: true
  webhookIngress:
    enabled: true
  pvc:
    volumeName: ""
    storage: 60Gi
    storageClassName: standard

modelRolloutWatcher:
  enabled: true
  image: asia-southeast1-docker.pkg.dev/recsys-mlops/recsys/recsys-mlops-training:gcp
  imagePullPolicy: Always
  autoProgressiveEnabled: true
  progressiveWeights: "10,25,50"
