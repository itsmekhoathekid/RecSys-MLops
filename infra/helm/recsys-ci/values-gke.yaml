namespace:
  create: false

productionTarget:
  enabled: true
  projectId: recsys-mlops
  region: asia-southeast1
  zone: asia-southeast1-b
  cluster: recsys-mlops-gke
  context: gke_recsys-mlops_asia-southeast1-b_recsys-mlops-gke
  imageRegistry: asia-southeast1-docker.pkg.dev/recsys-mlops/recsys

jenkins:
  nodeSelector:
    recsys.ai/pool: cpu-services
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  runtimeCredentialsSecret:
    enabled: true
  dind:
    # Reuse Jenkins home for Docker graph data so GKE provisions one CI disk.
    # Full releases retain large Spark/Flink/ML layers alongside Jenkins metadata,
    # so the production override keeps enough headroom for image assembly.
    useJenkinsHomePvc: true
    pvc:
      enabled: false
      storage: 200Gi
      storageClassName: standard-rwo
  runtimeTools:
    installOnStartup: true
  webhookIngress:
    enabled: true
  pvc:
    volumeName: ""
    storage: 100Gi
    storageClassName: standard

modelRolloutWatcher:
  enabled: true
  image: asia-southeast1-docker.pkg.dev/recsys-mlops/recsys/recsys-mlops-training:gcp
  imagePullPolicy: Always
  nodeSelector:
    recsys.ai/pool: ml-system
  tolerations:
    - key: recsys.ai/workload
      operator: Equal
      value: ml-system
      effect: NoSchedule
  autoProgressiveEnabled: true
  progressiveWeights: "10,25,50"
