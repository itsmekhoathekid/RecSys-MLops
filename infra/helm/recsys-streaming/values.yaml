namespace:
  name: recsys-dataflow
images:
  dataIngestion: registry.example.invalid/recsys/recsys-data-ingestion:required
  flink: registry.example.invalid/recsys/recsys-flink:required
  pullPolicy: IfNotPresent
minio:
  endpoint: http://data-platform-minio:9000
flinkTaskManager:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
flink:
  checkpointStorageUri: s3a://recsys-lakehouse/flink-checkpoints
  istioInject: "false"
  scheduler: adaptive
  metricsPort: 9249
  taskSlots: "1"
  taskManagerProcessMemory: "6144m"
  taskManagerTaskHeapMemory: "2048m"
  taskManagerManagedMemory: "2048m"
  taskManagerJvmOverheadMax: "2048m"
  stateBackend: rocksdb
  stateBackendIncremental: "true"
  managedConsumerWeights: "OPERATOR:70,STATE_BACKEND:30,PYTHON:70"
  pythonManagedMemory: "true"
  pythonBundleSize: "1000"
  pythonBundleTimeMs: "200"
  disableJemalloc: true
  javaOpens: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED"
realtimeProducer:
  enabled: true
  name: realtime-event-producer
  replicas: 1
  rollout:
    maxSurge: 0
    maxUnavailable: 1
realtimeFlinkConsumer:
  enabled: true
  replicas: 1
  istioInject: ""
  online:
    enabled: true
    name: realtime-flink-online-store
    groupIdSuffix: online
    startingOffsets: committed-offsets
    restorePath: ""
  offline:
    enabled: true
    name: realtime-flink-offline-store
    groupIdSuffix: offline
    startingOffsets: latest
    restorePath: ""
  topic: cdc.behavior_events
  groupId: recsys-flink-realtime
  minEvents: "0"
  maxEvents: "0"
  parallelism: "1"
  maxHistoryLength: "50"
  progressLogEvents: "100"
  checkpointIntervalSeconds: "30"
  kafkaFetchMaxBytes: "1048576"
  kafkaMaxPartitionFetchBytes: "262144"
  kafkaMaxPollRecords: "100"
  redisSinkMaxEventsPerSecond: "200"
  postgresSinkMaxEventsPerSecond: "100"
  sinkRateLimitBurstEvents: "25"
  asyncIoCapacity: "64"
  asyncIoTimeoutSeconds: "120"
  postgresAsyncPoolSize: "16"
  offlineStoreEnabled: true
  offlineStoreSink: postgres
flinkAutoscaler:
  enabled: true
  version: "1.15.0"
  scalingEnabled: true
  stabilizationInterval: 1m
  metricsWindow: 3m
  targetUtilization: "0.65"
  utilizationMin: "0.50"
  utilizationMax: "0.80"
  catchUpDuration: 5m
  restartTime: 2m
  pipelineMaxParallelism: "120"
  vertexMinParallelism: "1"
  vertexMaxParallelism: "4"
  taskManagerHpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCpuUtilization: 65
    scaleDownStabilizationSeconds: 300
