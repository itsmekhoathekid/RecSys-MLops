{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.secretStore.name -}}
{{- $refresh := .Values.externalSecrets.refreshInterval -}}
{{- $services := .Values.services | default dict -}}
{{- $hasMcpManifest := gt (len $services) 0 -}}
{{- range $name, $secret := .Values.externalSecrets }}
{{- if kindIs "map" $secret }}
{{- $manifestOwnsMcp := and $hasMcpManifest (or (eq $name "featureRagMcp") (eq $name "recommendationMcp")) -}}
{{- if and (not $manifestOwnsMcp) (or (not (hasKey $secret "enabled")) $secret.enabled) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.secretName }}
  namespace: {{ $secret.namespace }}
  labels:
    app.kubernetes.io/part-of: recsys-mlops
    recsys.ai/security-scope: {{ $name | quote }}
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $secret.secretName }}
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy | default "Owner" }}
    {{- if or $secret.trimMilvusPassword $secret.annotations }}
    template:
      mergePolicy: Merge
      {{- if $secret.trimMilvusPassword }}
      # Feast substitutes this value into YAML before parsing it. Trimming at
      # the ExternalSecret boundary prevents trailing newlines from becoming a
      # different Milvus credential at runtime.
      data:
        MILVUS_PASSWORD: {{ `{{ .MILVUS_PASSWORD | trim }}` | quote }}
      {{- end }}
      {{- with $secret.annotations }}
      metadata:
        annotations:
          {{- toYaml . | nindent 10 }}
      {{- end }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ $secret.vaultPath | quote }}
    {{- range $additionalPath := ($secret.additionalVaultPaths | default list) }}
    - extract:
        key: {{ $additionalPath | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $hasMcpManifest }}
{{- range $serviceName, $service := $services }}
{{- $serviceEnabled := false -}}
{{- if eq $serviceName "featureRag" -}}
{{- $serviceEnabled = $.Values.externalSecrets.featureRagMcp.enabled -}}
{{- else if eq $serviceName "recommendation" -}}
{{- $serviceEnabled = $.Values.externalSecrets.recommendationMcp.enabled -}}
{{- else -}}
{{- fail (printf "unsupported MCP auth service %q" $serviceName) -}}
{{- end -}}
{{- if $serviceEnabled }}
{{- range $revisionName, $revision := $service.revisions }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required (printf "services.%s.revisions.%s.secretName is required" $serviceName $revisionName) $revision.secretName }}
  namespace: {{ required (printf "services.%s.namespace is required" $serviceName) $service.namespace }}
  annotations:
    recsys.ai/mcp-auth-service: {{ $serviceName | quote }}
    recsys.ai/mcp-auth-workload: {{ required (printf "services.%s.revisions.%s.workloadName is required" $serviceName $revisionName) $revision.workloadName | quote }}
    recsys.ai/mcp-auth-deploy: {{ $revision.deploy | toString | quote }}
  labels:
    app.kubernetes.io/part-of: recsys-mlops
    recsys.ai/security-scope: {{ printf "%s-%s" $serviceName $revisionName | quote }}
    recsys.ai/auth-revision: {{ $revisionName | quote }}
spec:
  {{- if $revision.legacy }}
  refreshInterval: {{ $refresh | quote }}
  {{- else }}
  refreshPolicy: CreatedOnce
  {{- end }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $revision.secretName }}
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy | default "Owner" }}
    {{- if not $revision.legacy }}
    immutable: true
    {{- end }}
  dataFrom:
    - extract:
        key: {{ required (printf "services.%s.vaultPath is required" $serviceName) $service.vaultPath | quote }}
        {{- if not $revision.legacy }}
        version: {{ required (printf "services.%s.revisions.%s.vaultVersion is required" $serviceName $revisionName) $revision.vaultVersion | quote }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
