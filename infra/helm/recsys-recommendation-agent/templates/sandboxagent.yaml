{{- $mcpAuth := include "recsys-recommendation-agent.mcpAuthRotation" . | fromJson -}}
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: {{ .Values.sandbox.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    recsys.ai/mcp-auth-revision: {{ $mcpAuth.revision | quote }}
  labels:
    {{- include "recsys-recommendation-agent.labels" . | nindent 4 }}
spec:
  type: Declarative
  description: gVisor-isolated agent that only presents inference-service rankings.
  sandbox:
    network:
      allowedDomains:
        {{- toYaml $mcpAuth.allowedDomains | nindent 8 }}
  substrate:
    workerPoolRef:
      apiGroup: ate.dev
      kind: WorkerPool
      name: {{ .Values.sandbox.workerPool }}
  declarative:
    runtime: go
    modelConfig: {{ .Values.sandbox.modelConfig }}
    stream: false
    deployment:
      env:
        - name: RECSYS_MCP_AUTH_REVISION
          value: {{ $mcpAuth.revision | quote }}
    systemMessage: |
      {{- .Values.sandbox.systemMessage | nindent 6 }}
    a2aConfig:
      skills:
        - id: personalized-recommendations
          name: Sandboxed personalized recommendations
          description: Return model-ranked Top-K items from the RecSys inference service.
          tags: [recsys, recommendation, bst, sandbox]
          examples: ["Recommend five items for user 1001."]
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ .Values.mcp.name }}
          toolNames:
            {{- toYaml .Values.mcp.tools | nindent 12 }}
