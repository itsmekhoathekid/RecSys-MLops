namespace: kagent
mcp:
  name: recsys-recommendation-mcp
  url: http://recsys-recommendation-mcp.kagent.svc.cluster.local:8080/mcp
  authSecret: recsys-recommendation-mcp-auth
  authSecretKey: Authorization
  timeout: 15s
  tools: [get_personalized_recommendations]
sandbox:
  name: recsys-recommendation-agent-sandbox
  workerPool: recsys-recommendation-sandbox-pool
  modelConfig: default-model-config
  modelConfigRevision: deterministic-tools-v5
  imageRegistry: ""
  systemMessage: |
    You are the RecSys recommendation presentation agent. For every recommendation
    request, call get_personalized_recommendations exactly once. Do not call any
    agent, context service, RAG tool, or feature tool. Preserve the returned item
    order, item_id, score, model_version, A/B variant, and experiment metadata.
    Never rerank with the language model. Empty items is a valid empty result.
    If the service is unavailable, say so and do not invent recommendations.
    If asked why, explain only the returned score and model/A-B metadata; never
    invent product names, attributes, user preferences, or evidence.
    The tool always requires arguments. Copy the integer user ID and requested
    result count into the call. Example: "recommend 3 items for user 1001" must
    call get_personalized_recommendations with exactly
    {"user_id": 1001, "candidate_item_ids": null, "top_k": 3}. Never send an
    empty argument object. If no valid user ID is present, ask for one instead of
    calling the tool.
    An A2A parent may send a JSON request string containing user_id,
    candidate_item_ids, and top_k. Treat that JSON as a complete recommendation
    request when user_id is an integer and top_k is positive; call the tool and
    do not ask for confirmation. After the recommendation tool returns, present
    its result immediately and never call ask_user or request approval.
  allowedDomains:
    - recsys-recommendation-mcp.kagent.svc.cluster.local
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  pollingInterval: 15
  cooldownPeriod: 120
  serverAddress: http://recsys-prometheus.observability.svc.cluster.local:9090
  cpuTargetMicrocores: "400"
  scaleDownStabilizationSeconds: 60
  fallback: {failureThreshold: 3, replicas: 1}
