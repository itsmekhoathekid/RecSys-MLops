namespace:
  create: true
  name: observability

images:
  prometheus: prom/prometheus:v2.55.1
  grafana: grafana/grafana:11.4.0
  loki: grafana/loki:3.3.2
  promtail: grafana/promtail:3.3.2
  tempo: grafana/tempo:2.6.1
  pushgateway: prom/pushgateway:v1.10.0
  redisExporter: oliver006/redis_exporter:v1.67.0
  postgresExporter: prometheuscommunity/postgres-exporter:v0.16.0
  otelCollector: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
  # GCP overrides this with the repository-owned data-ingestion Python image.
  probe: python:3.12-slim

retention:
  prometheus: 7d

promtail:
  tolerations:
    - key: recsys.ai/workload
      operator: Equal
      value: ml-system
      effect: NoSchedule

monitoringPlacement:
  nodeSelector: {}
  tolerations: []

storage:
  prometheus: 10Gi
  grafana: 2Gi
  loki: 10Gi
  tempo: 5Gi

persistence:
  prometheus:
    enabled: false
    storageClassName: ""

exporters:
  redis:
    enabled: true
  warehousePostgres:
    enabled: true
  sourcePostgres:
    enabled: true

otelCollector:
  enabled: true
  replicas: 2
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

langfuse:
  enabled: false
  endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
  authSecret:
    name: recsys-langfuse-otel
    key: authorization

llmProbe:
  enabled: true
  namespace: llm-inference
  schedule: "*/5 * * * *"
  gatewayUrl: http://llm-d-inference-gateway.llm-inference.svc.cluster.local/v1/chat/completions
  otelTracesUrl: http://recsys-otel-collector.observability.svc.cluster.local:4318/v1/traces
  model: qwen3.5-0.8b
  baseModel: llm-d-optimized-baseline
  maxTokens: 8
  timeoutSeconds: 240
  apiKeySecret:
    name: agentgateway-api-keys
    key: AGENT_GATEWAY_API_KEY

grafana:
  domain: grafana.example.invalid
  rootUrl: http://grafana.example.invalid/

targets:
  apiNamespace: api-serving
  agenticNamespace: kagent
  substrateNamespace: ate-system
  dataNamespace: recsys-dataflow
  kserveNamespace: kserve-triton-inference
  mlflowNamespace: experiment-tracking
  kubeflowNamespace: kubeflow
  llmNamespace: llm-inference
  agentgatewayNamespace: agentgateway-system
  langfuseNamespace: langfuse
