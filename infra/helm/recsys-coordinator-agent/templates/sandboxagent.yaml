apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: {{ .Values.sandbox.name }}
  namespace: {{ .Values.namespace }}
{{- if .Values.releaseMetadata.registryRef }}
  annotations:
    recsys.dev/agent-registry-ref: {{ .Values.releaseMetadata.registryRef | quote }}
    recsys.dev/agent-release-version: {{ .Values.releaseMetadata.version | quote }}
    recsys.dev/contract-sha256: {{ .Values.releaseMetadata.contractSha256 | quote }}
{{- end }}
  labels:
    {{- include "recsys-coordinator-agent.labels" . | nindent 4 }}
spec:
  type: Declarative
  description: Intent-routing RecSys coordinator with sandboxed A2A-only specialist access.
  sandbox:
    network:
      allowedDomains:
        {{- toYaml .Values.sandbox.allowedDomains | nindent 8 }}
  substrate:
    workerPoolRef:
      apiGroup: ate.dev
      kind: WorkerPool
      name: {{ .Values.sandbox.workerPool }}
  declarative:
    runtime: {{ required "sandbox.runtime is required" .Values.sandbox.runtime }}
    modelConfig: {{ .Values.sandbox.modelConfig }}
    stream: false
    deployment:
      env:
        - name: RECSYS_AGENT_RELEASE_VERSION
          value: {{ .Values.releaseMetadata.version | quote }}
    systemMessage: |
      {{- .Values.sandbox.systemMessage | replace "kagent__NS__recsys_context_agent_sandbox" (printf "kagent__NS__%s" (.Values.agents.context.name | replace "-" "_")) | replace "kagent__NS__recsys_recommendation_agent_sandbox" (printf "kagent__NS__%s" (.Values.agents.recommendation.name | replace "-" "_")) | nindent 6 }}
    a2aConfig:
      skills:
        - id: coordinated-personalized-recommendation
          name: Coordinated personalized recommendation
          description: Route recommendation and grounded context work to the appropriate RecSys specialists.
          tags: [recsys, coordinator, recommendation, rag, sandbox]
          examples:
            - "Recommend three items for user 1001 and explain them with grounded evidence."
    tools:
      - type: Agent
        agent:
          apiGroup: {{ .Values.agents.context.apiGroup }}
          kind: {{ .Values.agents.context.kind }}
          name: {{ .Values.agents.context.name }}
      - type: Agent
        agent:
          apiGroup: {{ .Values.agents.recommendation.apiGroup }}
          kind: {{ .Values.agents.recommendation.kind }}
          name: {{ .Values.agents.recommendation.name }}
