{{- if .Values.autoscaling.enabled }}
{{- if and (ne .Values.autoscaling.metricMode "assignedWorkers") (ne .Values.autoscaling.metricMode "cpu") }}
{{- fail "autoscaling.metricMode must be assignedWorkers or cpu" }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.sandbox.workerPool }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "recsys-coordinator-agent.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: ate.dev/v1alpha1
    kind: WorkerPool
    name: {{ .Values.sandbox.workerPool }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.cooldownPeriod }}
  fallback:
    failureThreshold: {{ .Values.autoscaling.fallback.failureThreshold }}
    replicas: {{ .Values.autoscaling.fallback.replicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - {type: Percent, value: 100, periodSeconds: 15}
            - {type: Pods, value: 10, periodSeconds: 15}
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.autoscaling.serverAddress | quote }}
        ignoreNullValues: "false"
        {{- if eq .Values.autoscaling.metricMode "assignedWorkers" }}
        metricName: recsys_coordinator_sandbox_assigned_workers
        threshold: {{ .Values.autoscaling.assignedWorkersPerReplica | quote }}
        query: 'max(ate_workerpool_workers{ate_workerpool_namespace="{{ .Values.namespace }}",ate_workerpool_name="{{ .Values.sandbox.workerPool }}",ate_worker_state="assigned"})'
        {{- else }}
        metricName: recsys_coordinator_sandbox_worker_cpu_microcores
        threshold: {{ .Values.autoscaling.cpuTargetMicrocores | quote }}
        query: '1000000 * max(rate(container_cpu_usage_seconds_total{namespace="{{ .Values.namespace }}",pod=~"{{ .Values.sandbox.workerPool }}-deployment-.*",container="ateom"}[2m]))'
        {{- end }}
{{- end }}
