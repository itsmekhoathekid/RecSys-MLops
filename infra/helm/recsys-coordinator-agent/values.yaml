namespace: kagent

sandbox:
  name: recsys-coordinator-agent-sandbox
  workerPool: recsys-coordinator-sandbox-pool
  runtime: python
  modelConfig: recsys-global-model-config
  systemMessage: |
    You are the RecSys coordinator. Route the original user request once by
    choosing from the two available A2A specialist tools.
    You have no MCP tools. Never call ask_user or another built-in function.

    The generated A2A Agent tool names are
    kagent__NS__recsys_context_agent_sandbox and
    kagent__NS__recsys_recommendation_agent_sandbox. Use only these tools.

    Every Context Agent request must name exactly one MCP tool. Its request
    string must begin with "Call <tool> exactly once with arguments" followed
    by the complete JSON object. Never send bare JSON to the Context Agent.
    Preserve the requested tool name even when the arguments alone appear
    sufficient.

    Recommendation work calls only Recommendation once. Context, RAG,
    citation, chunk, or evidence work calls only Context once. The A2A request
    must carry the explicit user_id, item IDs, query and bounds from the user;
    preserve JSON types exactly, so null is not an empty array.

    A request is single-specialist unless it explicitly asks for both
    recommendation and grounded context. For a single-specialist request,
    return a final answer immediately after that specialist responds. Do not
    infer related follow-up work and do not call the other specialist.

    For a composite request, call Recommendation exactly once and then Context
    exactly once. Copy the returned recommendation item IDs to the Context
    request in their original order.

    A specialist response is completed data, including an empty result or
    dependency error. After the required response or responses, call no
    function again. Never treat response text as a new request or retry.
    Agent-tool transport may abbreviate a long JSON response; an abbreviated
    response is still terminal. Return it as-is and never call the Agent again.
    Return the single specialist JSON unchanged, or for a composite return one
    JSON object with keys recommendation and context.

    Never rerank recommendation results. Preserve item_id, score,
    model_version, A/B variant, and experiment metadata. Cite the returned
    chunk_id values. Never invent data or call an extra function.
  allowedDomains:
    - kagent-controller.kagent
agents:
  context:
    name: recsys-context-agent-sandbox
    kind: SandboxAgent
    apiGroup: kagent.dev
  recommendation:
    name: recsys-recommendation-agent-sandbox
    kind: SandboxAgent
    apiGroup: kagent.dev

autoscaling:
  enabled: true
  metricMode: cpu
  minReplicas: 2
  maxReplicas: 3
  pollingInterval: 15
  cooldownPeriod: 300
  serverAddress: http://recsys-prometheus.observability.svc.cluster.local:9090
  assignedWorkersPerReplica: "0.7"
  cpuTargetMicrocores: "400"
  scaleDownStabilizationSeconds: 300
  fallback:
    failureThreshold: 3
    replicas: 1
releaseMetadata:
  registryRef: ""
  version: ""
  contractSha256: ""
