gateway:
  ingressClassName: nginx
  domain: example.invalid

auth:
  enabled: true
  createSecret: true
  secretName: recsys-gateway-basic-auth
  realm: RecSys Gateway
  # No real credential is stored in git. Create an ignored htpasswd file with:
  #   make gateway-create-auth GATEWAY_PASSWORD='<rotated-password>'
  # Then install with:
  #   --set-file auth.htpasswd=.gateway-auth/auth
  htpasswd: "recsys:!set-auth-htpasswd-before-deploy"

tls:
  enabled: false
  clusterIssuerName: letsencrypt-staging
  issuer:
    create: false
    name: letsencrypt-staging
    email: change-me@example.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretName: letsencrypt-staging-account-key
  secretNames:
    api: recsys-api-tls
    featureApi: recsys-feature-api-tls
    grafana: recsys-grafana-tls
    logs: recsys-logs-tls
    traces: recsys-traces-tls
    agents: recsys-agents-tls
    registry: recsys-registry-tls
    rag: recsys-rag-tls

api:
  enabled: true
  namespace: api-serving
  host: api.example.invalid
  service:
    name: recsys-inference-api
    port: 80
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"

featureApi:
  enabled: true
  namespace: api-serving
  host: features.example.invalid
  rootRedirect:
    enabled: false
    path: /docs
  service:
    name: recsys-online-feature-api
    port: 80
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"

grafana:
  enabled: true
  namespace: observability
  host: grafana.example.invalid
  meshRoute:
    enabled: true
  service:
    name: recsys-grafana
    port: 3000
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"

logs:
  enabled: true
  namespace: observability
  host: logs.example.invalid
  rootRedirect:
    enabled: true
    path: /d/recsys-logs/logs-overview
  service:
    name: recsys-loki
    port: 3100
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"

traces:
  enabled: true
  namespace: observability
  host: traces.example.invalid
  service:
    name: recsys-tempo
    port: 3200
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"

agents:
  enabled: false
  namespace: kagent
  host: agents.example.invalid
  upstreamHost: kagent-ui.kagent.svc.cluster.local
  service:
    name: kagent-ui
    port: 8080
  proxy:
    readTimeoutSeconds: "1800"
    sendTimeoutSeconds: "1800"
  rateLimit:
    enabled: true
    rps: "20"
    rpm: "600"
    connections: "20"
    statusCode: "429"

registry:
  enabled: false
  namespace: agentregistry
  host: registry.example.invalid
  upstreamHost: agentregistry.agentregistry.svc.cluster.local
  service:
    name: agentregistry
    port: 12121
  rateLimit:
    enabled: true
    rps: "20"
    rpm: "600"
    connections: "20"
    statusCode: "429"

rag:
  enabled: false
  namespace: api-serving
  host: rag.example.invalid
  upstreamHost: recsys-rag-api.api-serving.svc.cluster.local
  ingressService:
    name: recsys-rag-api-ingress-upstream
  rootRedirect:
    enabled: true
    path: /docs
  service:
    name: recsys-rag-api
    port: 80
  rateLimit:
    enabled: true
    rps: "5"
    rpm: "120"
    connections: "10"
    statusCode: "429"
