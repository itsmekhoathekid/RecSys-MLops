{{- if .Values.rag.enabled }}
{{- $rateLimit := .Values.rag.rateLimit | default dict }}
{{- $ingressService := .Values.rag.ingressService | default dict }}
{{- $ingressServiceName := $ingressService.name | default (printf "%s-ingress-upstream" .Values.rag.service.name) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recsys-rag-api-gateway
  namespace: {{ .Values.rag.namespace }}
  annotations:
    {{- if .Values.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.auth.secretName }}
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.auth.realm | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: {{ .Values.rag.upstreamHost | default (printf "%s.%s.svc.cluster.local" .Values.rag.service.name .Values.rag.namespace) | quote }}
    {{- if ($rateLimit.enabled | default false) }}
    nginx.ingress.kubernetes.io/limit-rps: {{ $rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-rpm: {{ $rateLimit.rpm | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ $rateLimit.connections | quote }}
    nginx.ingress.kubernetes.io/limit-req-status-code: {{ $rateLimit.statusCode | quote }}
    {{- end }}
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuerName | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingressClassName }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.rag.host }}
      secretName: {{ .Values.tls.secretNames.rag }}
  {{- end }}
  rules:
    - host: {{ .Values.rag.host }}
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ $ingressServiceName }}
                port:
                  number: {{ .Values.rag.service.port }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: {{ $ingressServiceName }}
                port:
                  number: {{ .Values.rag.service.port }}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ $ingressServiceName }}
                port:
                  number: {{ .Values.rag.service.port }}
          - path: /v1/rag
            pathType: Prefix
            backend:
              service:
                name: {{ $ingressServiceName }}
                port:
                  number: {{ .Values.rag.service.port }}
{{- if ((.Values.rag.rootRedirect | default dict).enabled | default false) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recsys-rag-api-root-redirect
  namespace: {{ .Values.rag.namespace }}
  annotations:
    {{- if .Values.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.auth.secretName }}
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.auth.realm | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/app-root: {{ .Values.rag.rootRedirect.path | default "/docs" | quote }}
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingressClassName }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.rag.host }}
      secretName: {{ .Values.tls.secretNames.rag }}
  {{- end }}
  rules:
    - host: {{ .Values.rag.host }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ $ingressServiceName }}
                port:
                  number: {{ .Values.rag.service.port }}
{{- end }}
{{- end }}
