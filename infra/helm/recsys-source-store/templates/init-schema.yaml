apiVersion: batch/v1
kind: Job
metadata:
  name: init-source-schema
  namespace: {{ .Values.namespace.name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: {{ .Values.istioInject | quote }}
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: init-source-schema
          image: {{ .Values.images.dataIngestion }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["bash", "-lc"]
          args:
            - |
              cleanup() {
                status=$?
                python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:15020/quitquitquit', method='POST'); urllib.request.urlopen(req, timeout=2).read()" >/dev/null 2>&1 || true
                exit "$status"
              }
              trap cleanup EXIT
              until PYTHONPATH=/opt/recsys/apps/data-platform/data-generator/src:/opt/recsys/apps/data-platform/src:/opt/recsys \
                /opt/venv/bin/python -m ingest.init_postgres_schema; do
                sleep 5
              done
          envFrom:
            - configMapRef:
                name: recsys-data-platform-config
            - secretRef:
                name: recsys-data-platform-secret
