{{- $contexts := include "recsys-recommendation-mcp.revisionContexts" . | fromJsonArray -}}
{{- range $context := $contexts }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $context.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "recsys-recommendation-mcp.revisionLabels" $context | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $context.name }}
{{- end }}
