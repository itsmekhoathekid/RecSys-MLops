apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Values.name }}, namespace: {{ .Values.namespace }}}
data:
  TRITON_URL: {{ .Values.config.tritonUrl | quote }}
  TRITON_MODEL_NAME: {{ .Values.config.tritonModelName | quote }}
  TRITON_TIMEOUT_SECONDS: {{ .Values.config.tritonTimeoutSeconds | quote }}
  TRITON_MAX_CONCURRENCY: {{ .Values.config.tritonMaxConcurrency | quote }}
  TRITON_CAPACITY_WAIT_SECONDS: {{ .Values.config.tritonCapacityWaitSeconds | quote }}
  FEATURE_API_URL: {{ .Values.config.featureApiUrl | quote }}
  FEATURE_API_TIMEOUT_SECONDS: {{ .Values.config.featureApiTimeoutSeconds | quote }}
  DEFAULT_TOP_K: {{ .Values.config.defaultTopK | quote }}
  MODEL_VERSION: {{ .Values.config.modelVersion | quote }}
  AB_TEST_ENABLED: {{ ternary "1" "0" .Values.abTest.enabled | quote }}
  AB_EXPERIMENT_ID: {{ .Values.abTest.experimentId | quote }}
  AB_CANDIDATE_WEIGHT_PERCENT: {{ .Values.abTest.candidateWeightPercent | quote }}
  AB_CONTROL_MODEL_VERSION: {{ .Values.abTest.controlModelVersion | quote }}
  AB_CANDIDATE_MODEL_VERSION: {{ .Values.abTest.candidateModelVersion | quote }}
  AB_CONTROL_TRITON_URL: {{ .Values.abTest.controlTritonUrl | quote }}
  AB_CANDIDATE_TRITON_URL: {{ .Values.abTest.candidateTritonUrl | quote }}
  AB_SHADOW_ENABLED: {{ ternary "1" "0" .Values.shadow.enabled | quote }}
  AB_SHADOW_SAMPLE_PERCENT: {{ .Values.shadow.samplePercent | quote }}
  AB_SHADOW_TIMEOUT_MS: {{ .Values.shadow.timeoutMs | quote }}
  AB_SHADOW_QUEUE_SIZE: {{ .Values.shadow.queueSize | quote }}
  AB_SHADOW_MAX_CONCURRENCY: {{ .Values.shadow.maxConcurrency | quote }}
  FORCE_NOT_READY: {{ .Values.config.forceNotReady | quote }}
  MODEL_ITEM_NUM: {{ .Values.config.modelItemNum | quote }}
  MODEL_CATEGORY_NUM: {{ .Values.config.modelCategoryNum | quote }}
  MODEL_BRAND_NUM: {{ .Values.config.modelBrandNum | quote }}
  MODEL_PRICE_BUCKET_NUM: {{ .Values.config.modelPriceBucketNum | quote }}
  MODEL_EVENT_TYPE_NUM: {{ .Values.config.modelEventTypeNum | quote }}
  MODEL_TIME_BUCKET_NUM: {{ .Values.config.modelTimeBucketNum | quote }}
  RECSYS_JSON_LOGS: {{ .Values.config.jsonLogs | quote }}
  RECSYS_OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
