apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: recsys-ab-private-adapters}
spec:
  podSelector:
    matchLabels: {app: recsys-ab-adapter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {istio: recsys-ab-gateway}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: recsys-ab-private-gateway}
spec:
  podSelector:
    matchLabels: {istio: recsys-ab-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: recsys-ab-router}
      ports: [{protocol: TCP, port: 8080}]
    - ports: [{protocol: TCP, port: 15021}]
