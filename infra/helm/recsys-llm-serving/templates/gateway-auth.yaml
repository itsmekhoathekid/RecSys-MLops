{{- if and .Values.gateway.enabled .Values.gateway.auth.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .Values.gateway.auth.policyName }}
  labels:
    {{- include "recsys-llm-serving.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  traffic:
    phase: PreRouting
    apiKeyAuthentication:
      mode: {{ .Values.gateway.auth.mode }}
      secretRef:
        name: {{ .Values.gateway.auth.secretName }}
{{- end }}
