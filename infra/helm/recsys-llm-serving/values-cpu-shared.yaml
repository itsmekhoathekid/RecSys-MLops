# Two lightweight llama.cpp replicas share the existing n2-standard-8
# recsys-mlops-cpu node. Low requests fit the busy data-platform pool while
# two-core limits let each replica accelerate when CPU is available.
replicaCount: 2

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server
  digest: sha256:9b518883e8faab479650ec802e02c9e37c6bb21d36168509efd8fb3c87fc1648
  pullPolicy: IfNotPresent

model:
  repository: ggml-org/Qwen3.5-0.8B-GGUF
  quantization: Q4_0
  alias: qwen3.5-0.8b
  contextSize: 4096
  parallel: 1
  threads: 2
  threadsBatch: 2
  batchSize: 512
  ubatchSize: 128
  disableMultimodal: true
  metrics: true

resources:
  requests:
    cpu: 100m
    memory: 1536Mi
  limits:
    cpu: "2"
    memory: 3Gi

nodeSelector:
  cloud.google.com/gke-nodepool: recsys-mlops-cpu

tolerations: []

cache:
  persistence:
    enabled: false
  emptyDir:
    sizeLimit: 2Gi

podMonitoring:
  enabled: true
  interval: 30s
