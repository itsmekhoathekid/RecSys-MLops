namespace:
  name: recsys-dataflow
storageClassName: ""
images:
  zookeeper: confluentinc/cp-zookeeper:7.5.0
  kafka: confluentinc/cp-kafka:7.5.0
  pullPolicy: IfNotPresent
zookeeper:
  persistence:
    enabled: true
    storage: 5Gi
kafka:
  name: kafka
  bootstrapServers: kafka:29092
  topicPartitions: 4
  retentionHours: "24"
  segmentBytes: "268435456"
  retentionCheckIntervalMs: "60000"
  persistence:
    enabled: true
    storage: 60Gi
realtimeFlinkConsumer:
  topic: cdc.behavior_events
