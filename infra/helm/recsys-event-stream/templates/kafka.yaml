{{- if .Values.zookeeper.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-data
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.zookeeper.persistence.storage }}
---
{{- end }}
{{- if .Values.kafka.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.kafka.persistence.storage }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: {{ .Values.namespace.name }}
spec:
  ports:
    - port: 2181
      targetPort: 2181
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ ternary 0 1 .Values.suspend }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: {{ .Values.images.zookeeper }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          ports:
            - containerPort: 2181
          {{- if .Values.zookeeper.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper
          {{- end }}
      {{- if .Values.zookeeper.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zookeeper-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  ports:
    - name: broker
      port: 29092
      targetPort: 29092
  selector:
    app: {{ .Values.kafka.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ ternary 0 1 .Values.suspend }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.kafka.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.kafka.name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ .Values.kafka.name }}.{{ .Values.namespace.name }}.svc.cluster.local:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: {{ .Values.kafka.topicPartitions | quote }}
            - name: KAFKA_LOG_RETENTION_HOURS
              value: {{ .Values.kafka.retentionHours | quote }}
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: {{ .Values.kafka.segmentBytes | quote }}
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: {{ .Values.kafka.retentionCheckIntervalMs | quote }}
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka
          ports:
            - containerPort: 29092
          {{- if .Values.kafka.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          {{- end }}
      {{- if .Values.kafka.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
      {{- end }}
