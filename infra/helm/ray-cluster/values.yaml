namespace: kubeflow

job:
  name: recsys-bst-ray-tune
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 300

image:
  repository: recsys-mlops-training
  tag: local
  pullPolicy: IfNotPresent

runtime:
  secretName: recsys-mlops-runtime
  pvcName: recsys-mlops-pvc
  workspaceMountPath: /workspace

entrypoint:
  baseConfigPath: /opt/recsys/configs/ml-system/training/bst.yaml
  splitDir: /workspace/recsys/data_platform/output/ml/bst_split
  outputDir: /workspace/recsys/data_platform/output/ml/ray
  bestResultPath: /workspace/recsys/data_platform/output/ml/ray/best_result.json
  trainingPercent: 0.01
  numEpochs: 1
  maxTrials: 2
  parallelTrials: 1
  cpusPerTrial: 1
  gpusPerTrial: 0

head:
  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: 1Gi
  memoryLimit: 3Gi
  rayNumCpus: "1"
  dashboardAgentGrpcPort: "52366"
  runtimeEnvAgentPort: "52367"
  rayMemoryBytes: "1073741824"
  objectStoreMemoryBytes: "268435456"
  nodeSelector: {}
  tolerations: []

worker:
  replicas: 1
  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: 2Gi
  memoryLimit: 4Gi
  dashboardAgentGrpcPort: "52366"
  runtimeEnvAgentPort: "52367"
  rayMemoryBytes: "2147483648"
  objectStoreMemoryBytes: "536870912"
  nodeSelector: {}
  tolerations: []

gpu:
  enabled: false
  limit: 1
  nodeSelector:
    nvidia.com/gpu.present: "true"
