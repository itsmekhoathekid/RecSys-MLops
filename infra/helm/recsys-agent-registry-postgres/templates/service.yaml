apiVersion: v1
kind: Service
metadata:
  name: {{ include "recsys-agent-registry-postgres.name" . }}
  labels:
    {{- include "recsys-agent-registry-postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "recsys-agent-registry-postgres.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

