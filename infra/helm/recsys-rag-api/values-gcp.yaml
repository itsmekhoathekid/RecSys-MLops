nodeSelector:
  recsys.ai/pool: cpu-services
tolerations: []

# The quota-capped CPU pool cannot temporarily host two model pods. Replace the
# old replica before scheduling the new one and reserve room for its Istio
# sidecar. The encoder can still burst to the chart's CPU/memory limits.
rollout:
  maxSurge: 0
  maxUnavailable: 1
resources:
  requests:
    cpu: 300m
    memory: 768Mi
