{{- $serviceCA := genCA "substrate-service-dns-ca" 3650 -}}
{{- $podCA := genCA "substrate-pod-identity-ca" 3650 -}}
{{- $actorCA := genCA "substrate-actor-id-ca" 3650 -}}
{{- $actorJWTKey := genPrivateKey "ecdsa" -}}
{{- $existingService := lookup "v1" "Secret" "podcertificate-controller-system" "service-dns-ca-pool" -}}
{{- $existingPod := lookup "v1" "Secret" "podcertificate-controller-system" "pod-identity-ca-pool" -}}
{{- $servicePool := dict "CAs" (list (dict "ID" "1" "SigningKeyPEM" $serviceCA.Key "RootCertificatePEM" $serviceCA.Cert)) | toJson | b64enc -}}
{{- $podPool := dict "CAs" (list (dict "ID" "1" "SigningKeyPEM" $podCA.Key "RootCertificatePEM" $podCA.Cert)) | toJson | b64enc -}}
{{- $serviceRoot := $serviceCA.Cert -}}
{{- $podRoot := $podCA.Cert -}}
{{- if $existingService -}}
{{- $servicePool = index $existingService.data "pool" -}}
{{- $decoded := $servicePool | b64dec | fromJson -}}
{{- $serviceRoot = index (index (index $decoded "CAs") 0) "RootCertificatePEM" -}}
{{- end -}}
{{- if $existingPod -}}
{{- $podPool = index $existingPod.data "pool" -}}
{{- $decoded := $podPool | b64dec | fromJson -}}
{{- $podRoot = index (index (index $decoded "CAs") 0) "RootCertificatePEM" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: service-dns-ca-pool
  namespace: podcertificate-controller-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  pool: {{ $servicePool }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pod-identity-ca-pool
  namespace: podcertificate-controller-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  pool: {{ $podPool }}
{{- if not (lookup "v1" "Secret" "ate-system" "actor-id-jwt-pool") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: actor-id-jwt-pool
  namespace: ate-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  pool: {{ dict "Authorities" (list (dict "ID" "1" "Algorithm" "ES256" "SigningKeyPEM" $actorJWTKey)) | toJson | b64enc }}
{{- end }}
{{- if not (lookup "v1" "Secret" "ate-system" "actor-id-ca-pool") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: actor-id-ca-pool
  namespace: ate-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  pool: {{ dict "CAs" (list (dict "ID" "1" "SigningKeyPEM" $actorCA.Key "RootCertificatePEM" $actorCA.Cert)) | toJson | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-ca-certs
  namespace: ate-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: |
    {{- $serviceRoot | nindent 4 }}
    {{- $podRoot | nindent 4 }}
