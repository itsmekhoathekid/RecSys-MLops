apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airflowPostgres.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: {{ .Values.airflowPostgres.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.airflowPostgres.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  serviceName: {{ .Values.airflowPostgres.name }}
  replicas: {{ ternary 0 1 .Values.suspend }}
  selector:
    matchLabels:
      app: {{ .Values.airflowPostgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.airflowPostgres.name }}
      annotations:
        sidecar.istio.io/inject: {{ .Values.airflowPostgres.istioInject | quote }}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.airflowPostgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.airflowPostgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-data-platform-secret
                  key: AIRFLOW_POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClassName }}
        storageClassName: {{ .Values.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.airflowPostgres.storage }}
