namespace:
  name: recsys-dataflow
storageClassName: ""
images:
  airflow: registry.example.invalid/recsys/recsys-airflow:required
  datahubOps: registry.example.invalid/recsys/recsys-datahub-ops:required
  ragIndexer: registry.example.invalid/recsys/recsys-rag-indexer:required
  featureStore: registry.example.invalid/recsys/recsys-feature-store:required
  driftRetrain: registry.example.invalid/recsys/recsys-drift-retrain:required
  sparkData: registry.example.invalid/recsys/recsys-spark-data:required
  sparkAnalytics: registry.example.invalid/recsys/recsys-spark-analytics:required
  analyticsDbt: registry.example.invalid/recsys/recsys-analytics-dbt:required
  postgres: postgres:16
  pullPolicy: IfNotPresent
airflowPostgres:
  name: airflow-postgres
  database: airflow
  user: airflow
  storage: 5Gi
  istioInject: "false"
airflow:
  dagsPath: /opt/recsys/apps/data-platform/src/orchestration/airflow/dags
  istioProxyCPU: 50m
  istioProxyMemory: 64Mi
  nodeSelector:
    recsys.ai/pool: cpu-services
  tolerations: []
