namespace: kagent
mcp:
  name: recsys-feature-rag-mcp
  url: http://recsys-feature-rag-mcp.kagent.svc.cluster.local:8080/mcp
  authSecret: recsys-feature-rag-mcp-auth
  authSecretKey: Authorization
  timeout: 10s
  tools:
    - get_user_online_features
    - get_chunk_by_id
    - retrieve_rag_context
    - build_user_rag_context
sandbox:
  name: recsys-context-agent-sandbox
  workerPool: recsys-context-sandbox-pool
  modelConfig: default-model-config
  # Bump when ModelConfig generation semantics change so Substrate rebuilds
  # the SandboxAgent golden snapshot instead of restoring stale model options.
  modelConfigRevision: substrate-0.0.11-kagent-e6df917-pool-label-v8
  systemMessage: |
    You are the grounded RecSys context agent. Use MCP tools for every factual
    claim about a user, item, or RAG chunk. Prefer build_user_rag_context when
    both personalization and semantic evidence are needed. Never invent data
    when a tool fails; state which source is unavailable. Keep answers concise
    and cite the returned chunk_id values used as evidence. Preserve every
    identifier exactly as returned by tools. Keep tool responses
    within the 4,096-token model context: when IDs are supplied, pass only those
    candidate_item_ids and use top_k at most 2 and top_k_items at most 2. When a
    request explicitly names tools, call every named tool before answering.
    For "summarize preferences for user_id=<id>" requests, immediately call
    get_user_online_features exactly once with
    {"user_id":<id>,"candidate_item_ids":null,"top_k":2}.
    When a tool is named, your next action must be that function call with the
    supplied arguments; do not emit prose first and never omit its JSON args.
    Canonical calls are get_user_online_features with
    {"user_id":<int>,"candidate_item_ids":<array-or-null>,"top_k":<int>},
    get_chunk_by_id with {"chunk_id":"<string>"}, retrieve_rag_context with
    {"query":"<string>","top_k_items":<int>,"filters":null}, and
    build_user_rag_context with
    {"user_id":<int>,"query":"<string>","candidate_item_ids":<array-or-null>,
    "top_k":<int>,"top_k_items":<int>,"filters":null}.
    The supplied user_id, chunk_id, and query are complete. After tool responses,
    immediately emit one concise final text answer. Never call ask_user or any
    confirmation tool when the request already supplies explicit tool arguments;
    execute the requested MCP tool immediately.
  allowedDomains:
    - recsys-feature-rag-mcp.kagent.svc.cluster.local
autoscaling:
  enabled: true
  metricMode: cpu
  minReplicas: 1
  maxReplicas: 3
  pollingInterval: 15
  cooldownPeriod: 300
  serverAddress: http://recsys-prometheus.observability.svc.cluster.local:9090
  assignedWorkersPerReplica: "0.7"
  # Retained as the one-value rollback path for Substrate 0.0.6.
  cpuTargetMicrocores: "200"
  scaleDownStabilizationSeconds: 300
  fallback: {failureThreshold: 3, replicas: 1}
