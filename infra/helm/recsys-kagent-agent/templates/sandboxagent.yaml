apiVersion: kagent.dev/v1alpha3
kind: SandboxAgent
metadata:
  name: {{ .Values.sandbox.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    recsys.ai/model-config-revision: {{ .Values.sandbox.modelConfigRevision | quote }}
  labels:
    {{- include "recsys-kagent-agent.labels" . | nindent 4 }}
spec:
  type: Declarative
  description: gVisor-isolated variant of the grounded RecSys context agent.
  sandbox:
    network:
      allowedDomains:
        {{- toYaml .Values.sandbox.allowedDomains | nindent 8 }}
  substrate:
    workerPoolRef:
      apiGroup: ate.dev
      kind: WorkerPool
      name: {{ .Values.sandbox.workerPool }}
  declarative:
    runtime: go
    modelConfig: {{ .Values.sandbox.modelConfig }}
    stream: false
    systemMessage: |
      {{- .Values.sandbox.systemMessage | nindent 6 }}
      Runtime model configuration revision: {{ .Values.sandbox.modelConfigRevision }}.
    a2aConfig:
      skills:
        - id: user-personalization
          name: Sandboxed user personalization
          description: Retrieve materialized online features for a user and candidates in gVisor.
          tags: [recsys, feast, personalization, sandbox]
          examples: ["Summarize the preferences for user 1001."]
        - id: exact-chunk
          name: Sandboxed exact chunk lookup
          description: Retrieve one grounded RAG chunk by its immutable chunk identifier in gVisor.
          tags: [recsys, rag, exact, sandbox]
          examples: ["Get the exact evidence chunk with ID 800080:review:rev_800080_02:0."]
        - id: rag-evidence
          name: Sandboxed semantic RAG evidence
          description: Retrieve semantic product evidence and composite user context in gVisor.
          tags: [recsys, rag, evidence, sandbox]
          examples: ["Build grounded context for user 1001 buying headphones."]
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ .Values.mcp.name }}
          toolNames:
            {{- toYaml .Values.mcp.tools | nindent 12 }}
