  # ml-system node; stateful stores and Superset remain on cpu-services.
  lakehouseThrift:
    recsys.ai/pool: ml-system
  trino:
    recsys.ai/pool: ml-system
  supersetDashboardBootstrap:
    recsys.ai/pool: ml-system
