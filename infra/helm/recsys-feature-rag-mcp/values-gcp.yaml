# Permit placement on either production node. The toleration below makes the
# tainted ML-system node eligible while an empty selector keeps CPU-services
# available when it has spare capacity.
nodeSelector: {}
tolerations:
  - key: recsys.ai/workload
    operator: Equal
    value: ml-system
    effect: NoSchedule
autoscaling:
  # The two-node quota-capped production cluster can safely prove 1 -> 3.
  minReplicas: 1
  maxReplicas: 3
  fallback:
    failureThreshold: 3
    replicas: 1
