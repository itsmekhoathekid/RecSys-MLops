{{- $contexts := include "recsys-feature-rag-mcp.revisionContexts" . | fromJsonArray -}}
{{- range $context := $contexts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $context.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "recsys-feature-rag-mcp.revisionLabels" $context | nindent 4 }}
data:
  ONLINE_FEATURE_API_URL: {{ $.Values.config.onlineFeatureApiUrl | quote }}
  RAG_API_URL: {{ $.Values.config.ragApiUrl | quote }}
  MCP_ALLOWED_ORIGINS: {{ $.Values.config.allowedOrigins | quote }}
  MCP_ALLOWED_HOSTS: {{ include "recsys-feature-rag-mcp.allowedHosts" (dict "root" $ "name" $context.name) | quote }}
  ONLINE_FEATURE_TIMEOUT_SECONDS: {{ $.Values.config.onlineFeatureTimeoutSeconds | quote }}
  RAG_TIMEOUT_SECONDS: {{ $.Values.config.ragTimeoutSeconds | quote }}
  DOWNSTREAM_MAX_CONNECTIONS: {{ $.Values.config.downstreamMaxConnections | quote }}
  DOWNSTREAM_MAX_KEEPALIVE_CONNECTIONS: {{ $.Values.config.downstreamMaxKeepaliveConnections | quote }}
  TOOL_CONTRACT_VERSION: {{ $.Values.config.toolContractVersion | quote }}
  TOOL_CONTRACT_SHA256: {{ $.Values.config.toolContractSha256 | quote }}
  RECSYS_IMAGE_REFERENCE: {{ $.Values.image | quote }}
{{- end }}
