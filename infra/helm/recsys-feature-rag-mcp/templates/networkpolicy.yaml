{{- if .Values.networkPolicy.enabled }}
{{- $contexts := include "recsys-feature-rag-mcp.revisionContexts" . | fromJsonArray -}}
{{- range $context := $contexts }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $context.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "recsys-feature-rag-mcp.revisionLabels" $context | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $context.name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Values.namespace }}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Values.networkPolicy.observabilityNamespaceLabel }}}
      ports: [{protocol: TCP, port: {{ $.Values.service.targetPort }}}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Values.networkPolicy.apiServingNamespaceLabel }}}
      ports: [{protocol: TCP, port: 80}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Values.networkPolicy.observabilityNamespaceLabel }}}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 9090}
{{- end }}
{{- end }}
